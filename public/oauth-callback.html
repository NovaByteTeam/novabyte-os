<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAuth Callback - NovaByte OS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .container { text-align: center; padding: 32px; }
    .spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 24px; margin-bottom: 12px; }
    p { color: rgba(255,255,255,0.6); }
    .success { color: #3fb950; }
    .error { color: #f85149; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1 id="status">Processing authentication...</h1>
    <p id="message">Please wait while we complete the authentication process.</p>
  </div>
  <script>
    // Check if running in iframe - redirect to top if needed
    // This fixes the "Unsafe attempt to load URL" error when OAuth callback
    // is loaded in a same-origin iframe (like the Horizon browser)
    if (window.top !== window) {
      // We're in an iframe - redirect the top window instead
      const params = new URLSearchParams(window.location.search);
      const redirectUrl = '/oauth-callback.html?' + params.toString();
      window.top.location.href = redirectUrl;
    } else {
      // Normal page load - proceed as usual
      // Parse URL parameters
      const params = new URLSearchParams(window.location.search);
      const auth = params.get('auth');
      const error = params.get('error');
      const provider = params.get('provider');
      const email = params.get('email');
      const state = params.get('state');
      
      // Build result object
      const result = {
        success: auth === 'success',
        error: error,
        provider: provider,
        email: email
      };
      
      // Update UI
      const statusEl = document.getElementById('status');
      const messageEl = document.getElementById('message');
      
      if (result.success) {
        statusEl.textContent = 'Authentication Successful!';
        statusEl.className = 'success';
        messageEl.textContent = `Connected ${email || provider} account. You can close this window.`;
        
        // Try to send message to parent/opener
        setTimeout(() => {
          try {
            // Try window.opener first (for popup windows)
            if (window.opener) {
              window.opener.postMessage({ type: 'oauth-result', ...result }, '*');
            }
            // Also try parent (for iframes)
            if (window.parent !== window) {
              window.parent.postMessage({ type: 'oauth-result', ...result }, '*');
            }
          } catch (e) {
            console.log('Could not post to parent:', e);
          }
        }, 500);
        
        // Store in localStorage for cross-tab communication (sessionStorage doesn't share between windows)
        try {
          localStorage.setItem('oauth-result', JSON.stringify({...result, timestamp: Date.now()}));
        } catch (e) {}
        
      } else {
        statusEl.textContent = 'Authentication Failed';
        statusEl.className = 'error';
        messageEl.textContent = error || 'An error occurred during authentication.';
        
        // Add try again button
        const btn = document.createElement('button');
        btn.textContent = '← Try Again';
        btn.style.cssText = 'margin-top: 20px; padding: 10px 20px; font-size: 14px; cursor: pointer; background: #58a6ff; border: none; border-radius: 6px; color: white;';
        btn.onclick = () => {
          // Go back to setup page
          window.location.href = '/setup.html';
        };
        document.querySelector('.container').appendChild(btn);
        
        // Send error to parent
        setTimeout(() => {
          try {
            if (window.opener) {
              window.opener.postMessage({ type: 'oauth-result', ...result }, '*');
            }
          } catch (e) {}
        }, 500);
      }
      
      // Auto-close after delay if successful
      if (result.success) {
        setTimeout(() => {
          // window.close(); // Commented out - browsers often block this
        }, 3000);
      }
    }
  </script>
</body>
</html>
