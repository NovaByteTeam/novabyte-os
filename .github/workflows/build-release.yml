name: Build and publish NovaByte

on:
  push:
    branches:
      - main
    paths:
      - 'NBOSP/**'
      - '!NBOSP/test/**'
      - '!NBOSP/vitest.config.js'

# Needed to create/update releases and upload assets
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            folder: win-x64
            asset: NovaByte-win-x64.zip
          - os: ubuntu-latest
            platform: linux
            folder: linux-x64
            asset: NovaByte-linux-x64.zip
          - os: macos-latest
            platform: osx
            folder: osx-arm64
            asset: NovaByte-osx-arm64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Installs NBOSP's OWN node_modules (including devDependencies like
      # nw-builder) at the repo root, separately from the staged copy
      # build.mjs creates internally. build.mjs now imports nw-builder from
      # here (nbospDir) rather than from its staged copy, because the staged
      # copy runs `npm ci --omit=dev` — devDependencies like `nw` (the full
      # NW.js SDK download) and `nw-builder` itself must never end up
      # packaged inside the shipped package.nw, but nw-builder still has to
      # be available *somewhere* for build.mjs to actually run the build.
      # Plain `npm ci` (no --omit=dev) here is intentional and correct: this
      # install never gets packaged into the shipped app, so there's no
      # downside to it including devDependencies.
      - name: Install NBOSP's own dependencies (for nw-builder)
        working-directory: NBOSP
        run: npm ci

      # Each matrix job runs npm ci natively on its own OS, so native
      # modules (e.g. better-sqlite3) compile correctly for that platform
      # instead of all three shipping Linux-compiled binaries. (build.mjs's
      # OWN internal npm ci for the staged copy now runs with --omit=dev, so
      # devDependencies like `nw`/`nw-builder` are excluded from the shipped
      # package — see build.mjs for details.)
      - name: Run build script for this platform
        working-directory: NBOSP
        run: node build.mjs
        env:
          NBOSP_BUILD_PLATFORM: ${{ matrix.platform }}

      - name: Zip platform build (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        run: Compress-Archive -Path "${{ matrix.folder }}" -DestinationPath "${{ matrix.asset }}"
        shell: pwsh

      - name: Zip platform build (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: build
        run: zip -r "${{ matrix.asset }}" "${{ matrix.folder }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: build/${{ matrix.asset }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Set release date
        id: date
        run: echo "date=$(date -u +'%d/%m/%Y')" >> "$GITHUB_OUTPUT"

      - name: Delete previous release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view NBOSP-PREBUILT --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name' | while read -r asset; do
            gh release delete-asset NBOSP-PREBUILT "$asset" --repo "${{ github.repository }}" -y || true
          done

      - name: Upload new release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload NBOSP-PREBUILT \
            artifacts/NovaByte-win-x64.zip \
            artifacts/NovaByte-linux-x64.zip \
            artifacts/NovaByte-osx-arm64.zip \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Update release notes with date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit NBOSP-PREBUILT --repo "${{ github.repository }}" --notes "Pre-built cross-platform binaries for NovaByte, built directly from the current NBOSP source (no cloning or \`npm install\` required — just download and run).

          Updated as of ${{ steps.date.outputs.date }}. This release is updated in place as NBOSP changes — binaries reflect the latest source as of the date above, not a fixed version snapshot.

          Available builds:
          - Windows (x64)
          - Linux (x64)
          - macOS (Apple Silicon / arm64)

          No installation needed — extract and run the executable for your platform."