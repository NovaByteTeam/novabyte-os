name: Build and publish NovaByte

on:
  push:
    branches:
      - main
    paths:
      - 'NBOSP/**'
      - '!NBOSP/test/**'
      - '!NBOSP/vitest.config.js'
  workflow_dispatch:

# Needed to create/update releases and upload assets
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            folder: win-x64
            asset: NovaByte-win-x64.zip
          - os: ubuntu-latest
            platform: linux
            folder: linux-x64
            asset: NovaByte-linux-x64.zip
          - os: macos-latest
            platform: osx
            folder: osx-arm64
            asset: NovaByte-osx-arm64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Installs NBOSP's OWN node_modules (including devDependencies like
      # nw-builder) at the repo root, separately from the staged copy
      # build.mjs creates internally. build.mjs now imports nw-builder from
      # here (nbospDir) rather than from its staged copy, because the staged
      # copy runs `npm ci --omit=dev` — devDependencies like `nw` (the full
      # NW.js SDK download) and `nw-builder` itself must never end up
      # packaged inside the shipped package.nw, but nw-builder still has to
      # be available *somewhere* for build.mjs to actually run the build.
      # Plain `npm ci` (no --omit=dev) here is intentional and correct: this
      # install never gets packaged into the shipped app, so there's no
      # downside to it including devDependencies.
      - name: Install NBOSP's own dependencies (for nw-builder)
        working-directory: NBOSP
        run: npm ci

      # Each matrix job runs npm ci natively on its own OS, so native
      # modules (e.g. better-sqlite3) compile correctly for that platform
      # instead of all three shipping Linux-compiled binaries. (build.mjs's
      # OWN internal npm ci for the staged copy now runs with --omit=dev, so
      # devDependencies like `nw`/`nw-builder` are excluded from the shipped
      # package — see build.mjs for details.)
      - name: Run build script for this platform
        working-directory: NBOSP
        run: node build.mjs
        env:
          NBOSP_BUILD_PLATFORM: ${{ matrix.platform }}

      - name: Zip platform build (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        # Call the Microsoft-shipped bsdtar at its full System32 path rather
        # than bare `tar`. On windows-latest, PATH can also contain Git for
        # Windows' bundled GNU tar, which has caused real breakage in other
        # projects when it got picked up instead of the native bsdtar. The
        # explicit path removes the ambiguity regardless of PATH ordering.
        shell: pwsh
        run: |
          & "$env:windir\System32\tar.exe" -a -cf "${{ matrix.asset }}" "${{ matrix.folder }}"

      - name: Zip platform build (macOS)
        if: runner.os == 'macOS'
        working-directory: build
        run: tar -a -cf "${{ matrix.asset }}" "${{ matrix.folder }}"

      - name: Zip platform build (Linux)
        if: runner.os == 'Linux'
        working-directory: build
        # GNU tar (Linux's default) can't produce a real .zip via -a the way
        # BSD tar (Windows/macOS) can — only .tar.gz/.tar.xz etc. Use zip
        # here instead. -r recurses into the folder, -y stores symlinks as
        # symlinks rather than following/dereferencing them.
        run: zip -ry "${{ matrix.asset }}" "${{ matrix.folder }}/"

      - name: Verify zip contents match source folder
        working-directory: build
        shell: bash
        # Catches the exact class of bug we hit before (a curated/guessed
        # file list silently dropping DLLs etc.) by comparing real file
        # counts on both sides — not raw archive entries, since those also
        # include directory and symlink entries that inflate the count and
        # don't correspond 1:1 with source files. Uses `unzip -l` on every
        # OS rather than `tar -tf`, because GNU tar cannot read zip archives
        # at all ("This does not look like a tar archive") — it's a real
        # parse failure, not a corruption signal, so tar is the wrong tool
        # to verify a .zip regardless of platform.
        run: |
          if ! command -v unzip >/dev/null 2>&1; then
            echo "::warning::unzip not found on this runner — skipping zip-content verification for ${{ matrix.folder }}. Runner images can drop preinstalled tools between updates; consider pinning a setup step if this recurs."
            exit 0
          fi

          FOLDER="${{ matrix.folder }}"
          ZIP="${{ matrix.asset }}"

          SOURCE_COUNT=$(find "$FOLDER" -type f | wc -l)

          # unzip -l lines look like: "     123  2026-07-25 18:02   folder/sub/file.ext"
          # Filter to lines with a non-zero size AND not ending in / (drops
          # directory entries). This undercounts legitimate 0-byte files,
          # which is an acceptable tradeoff for a loose sanity check.
          ZIP_COUNT=$(unzip -l "$ZIP" | awk 'NF>3 && $1+0>0 && $NF !~ /\/$/ {c++} END{print c+0}')

          echo "Source files: $SOURCE_COUNT | Real (non-dir) zip entries: $ZIP_COUNT"

          if [ "$ZIP_COUNT" -lt 1 ]; then
            echo "::error::Zip appears empty, unreadable, or malformed for ${FOLDER}."
            exit 1
          fi

          # Loose sanity check, not exact match: 0-byte files and symlinks
          # can cause small legitimate divergence between the two counts.
          DIFF=$(( SOURCE_COUNT - ZIP_COUNT ))
          if [ "$DIFF" -lt 0 ]; then DIFF=$(( -DIFF )); fi
          THRESHOLD=$(( SOURCE_COUNT / 10 + 5 ))
          if [ "$DIFF" -gt "$THRESHOLD" ]; then
            echo "::error::Zip entry count (${ZIP_COUNT}) diverges too far from source file count (${SOURCE_COUNT}, threshold ${THRESHOLD}) — possible missing files."
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: build/${{ matrix.asset }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Set release date
        id: date
        run: echo "date=$(date -u +'%d/%m/%Y')" >> "$GITHUB_OUTPUT"

      - name: Delete previous release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view NBOSP-PREBUILT --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name' | while read -r asset; do
            gh release delete-asset NBOSP-PREBUILT "$asset" --repo "${{ github.repository }}" -y || true
          done

      - name: Upload new release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload NBOSP-PREBUILT \
            artifacts/NovaByte-win-x64.zip \
            artifacts/NovaByte-linux-x64.zip \
            artifacts/NovaByte-osx-arm64.zip \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Update release notes with date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit NBOSP-PREBUILT --repo "${{ github.repository }}" --notes "Pre-built cross-platform binaries for NovaByte, built directly from the current NBOSP source (no cloning or \`npm install\` required — just download and run).

          Updated as of ${{ steps.date.outputs.date }}. This release is updated in place as NBOSP changes — binaries reflect the latest source as of the date above, not a fixed version snapshot.

          Available builds:
          - Windows (x64)
          - Linux (x64)
          - macOS (Apple Silicon / arm64)

          No installation needed — extract and run the executable for your platform."