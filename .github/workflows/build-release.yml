name: Build and publish NovaByte

on:
  push:
    branches:
      - main
    paths:
      - 'NBOSP/**'
      - '!NBOSP/test/**'
      - '!NBOSP/vitest.config.js'
  workflow_dispatch:

# Needed to create/update releases and upload assets
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            folder: win-x64
            asset: NovaByte-win-x64.zip
          - os: ubuntu-latest
            platform: linux
            folder: linux-x64
            asset: NovaByte-linux-x64.zip
          - os: macos-latest
            platform: osx
            folder: osx-arm64
            asset: NovaByte-osx-arm64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Installs NBOSP's OWN node_modules (including devDependencies like
      # nw-builder) at the repo root, separately from the staged copy
      # build.mjs creates internally. build.mjs now imports nw-builder from
      # here (nbospDir) rather than from its staged copy, because the staged
      # copy runs `npm ci --omit=dev` — devDependencies like `nw` (the full
      # NW.js SDK download) and `nw-builder` itself must never end up
      # packaged inside the shipped package.nw, but nw-builder still has to
      # be available *somewhere* for build.mjs to actually run the build.
      # Plain `npm ci` (no --omit=dev) here is intentional and correct: this
      # install never gets packaged into the shipped app, so there's no
      # downside to it including devDependencies.
      - name: Install NBOSP's own dependencies (for nw-builder)
        working-directory: NBOSP
        run: npm ci

      # Each matrix job runs npm ci natively on its own OS, so native
      # modules (e.g. better-sqlite3) compile correctly for that platform
      # instead of all three shipping Linux-compiled binaries. (build.mjs's
      # OWN internal npm ci for the staged copy now runs with --omit=dev, so
      # devDependencies like `nw`/`nw-builder` are excluded from the shipped
      # package — see build.mjs for details.)
      - name: Run build script for this platform
        working-directory: NBOSP
        run: node build.mjs
        env:
          NBOSP_BUILD_PLATFORM: ${{ matrix.platform }}

      - name: Zip platform build (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        # Call the Microsoft-shipped bsdtar at its full System32 path rather
        # than bare `tar`. On windows-latest, PATH can also contain Git for
        # Windows' bundled GNU tar, which has caused real breakage in other
        # projects when it got picked up instead of the native bsdtar. The
        # explicit path removes the ambiguity regardless of PATH ordering.
        shell: pwsh
        run: |
          & "$env:windir\System32\tar.exe" -a -cf "${{ matrix.asset }}" "${{ matrix.folder }}"

      - name: Zip platform build (macOS)
        if: runner.os == 'macOS'
        working-directory: build
        run: tar -a -cf "${{ matrix.asset }}" "${{ matrix.folder }}"

      - name: Zip platform build (Linux)
        if: runner.os == 'Linux'
        working-directory: build
        # GNU tar (Linux's default) can't produce a real .zip via -a the way
        # BSD tar (Windows/macOS) can — only .tar.gz/.tar.xz etc. Use zip
        # here instead. -r recurses into the folder, -y stores symlinks as
        # symlinks rather than following/dereferencing them.
        run: zip -ry "${{ matrix.asset }}" "${{ matrix.folder }}/"

      - name: Verify zip contents match source folder
        working-directory: build
        shell: bash
        # Replaces the old count-based sanity check with a strict path-level
        # diff: every real file/symlink in the source folder must appear at
        # the identical relative path inside the zip, and vice versa. A
        # count match can hide a swap (N files present but the wrong N —
        # e.g. a stale build's assets zipped instead of the fresh one) or a
        # tolerated loss under the old 10%+5 threshold. This catches both,
        # and fails loudly with the exact missing/extra paths instead of a
        # fuzzy "diverges too far" message.
        #
        # Uses `unzip -Z1` (zipinfo, one path per line) rather than
        # `unzip -l`, because -l's output is a human-readable column format
        # meant for eyeballing, not parsing — awk has to guess column
        # boundaries and can misparse filenames containing spaces or
        # unusual characters. -Z1 gives exactly one raw path per line, no
        # column-counting fragility, and naturally includes 0-byte files.
        #
        # `unzip` is used on every OS (including on the Windows/macOS zips,
        # which are built with bsdtar, not `zip`) rather than `tar -tf`,
        # because GNU tar cannot read zip archives at all ("This does not
        # look like a tar archive") — bsdtar's .zip output is standard
        # PKZIP format regardless of which tool created it, so unzip reads
        # it fine; tar is simply the wrong tool to inspect a .zip on any
        # platform.
        run: |
          if ! command -v unzip >/dev/null 2>&1; then
            echo "::warning::unzip not found on this runner — skipping zip-content verification for ${{ matrix.folder }}. Runner images can drop preinstalled tools between updates; consider pinning a setup step if this recurs."
            exit 0
          fi

          FOLDER="${{ matrix.folder }}"
          ZIP="${{ matrix.asset }}"

          # --- Integrity test first: confirms the archive isn't corrupted,
          # separate from and prior to inspecting its contents. `unzip -l`/
          # `-Z1` can successfully list a central directory that still fails
          # to actually extract (truncated data, bad CRCs); `-t` re-reads
          # and CRC-checks every entry.
          if ! unzip -t "$ZIP" > /dev/null; then
            echo "::error::Zip failed integrity test (corrupted or truncated) for ${FOLDER}."
            exit 1
          fi

          # --- Size floor: catches a structurally valid but suspiciously
          # small zip (e.g. build silently dropped a large asset bundle)
          # that a path-diff alone wouldn't flag if file *counts* still
          # happen to line up. Calibrated against real observed NBOSP
          # release sizes (NBOSP-PREBUILT release, 26/07/2026): linux-x64
          # 202 MB, osx-arm64 184 MB, win-x64 222 MB. 160 MB sits below the
          # smallest of those (osx, 184 MB) with meaningful headroom while
          # still catching a build that's lost a large chunk of itself.
          # Revisit if a legitimately smaller platform build is ever added.
          MIN_SIZE=$((160 * 1024 * 1024))
          ZIP_SIZE=$(stat -c%s "$ZIP" 2>/dev/null || stat -f%z "$ZIP")
          if [ "$ZIP_SIZE" -lt "$MIN_SIZE" ]; then
            echo "::error::Zip suspiciously small (${ZIP_SIZE} bytes, expected at least ${MIN_SIZE}) for ${FOLDER}."
            exit 1
          fi
          echo "Zip size: ${ZIP_SIZE} bytes (ok)"

          # --- Path-level diff. Source list includes symlinks alongside
          # regular files (`-type f,l`) since the Linux zip step stores
          # symlinks as symlinks (`zip -y`), not dereferenced — they're
          # real, expected entries in the zip, not divergence to tolerate.
          # Both lists are stripped of the "$FOLDER/" prefix so they're
          # comparable as plain relative paths; unzip -Z1 entries already
          # start with that prefix because $ZIP was built by zipping/taring
          # "$FOLDER" itself (see the zip steps above), and directory
          # entries (trailing "/") are dropped since they don't correspond
          # to real source files.
          find "$FOLDER" \( -type f -o -type l \) | sed "s|^$FOLDER/||" | sort > /tmp/source_files.txt
          unzip -Z1 "$ZIP" | grep -v '/$' | sed "s|^$FOLDER/||" | sort > /tmp/zip_files.txt

          MISSING=$(comm -23 /tmp/source_files.txt /tmp/zip_files.txt)
          EXTRA=$(comm -13 /tmp/source_files.txt /tmp/zip_files.txt)

          SOURCE_COUNT=$(wc -l < /tmp/source_files.txt)
          ZIP_COUNT=$(wc -l < /tmp/zip_files.txt)
          echo "Source files: ${SOURCE_COUNT} | Zip entries: ${ZIP_COUNT}"

          if [ -n "$MISSING" ]; then
            echo "::error::Files present in source but MISSING from zip for ${FOLDER}:"
            echo "$MISSING" | sed 's/^/  - /'
          fi
          if [ -n "$EXTRA" ]; then
            # Not necessarily a bug (e.g. a leftover from a previous run in
            # the same working directory) but worth surfacing loudly rather
            # than silently ignoring — an unexpected extra file is still an
            # unexplained divergence between what was built and what shipped.
            echo "::warning::Files present in zip but NOT in source for ${FOLDER} (unexpected):"
            echo "$EXTRA" | sed 's/^/  - /'
          fi
          if [ -n "$MISSING" ]; then
            exit 1
          fi

          echo "Zip verification passed for ${FOLDER}: integrity ok, size ok, all source files present."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: build/${{ matrix.asset }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Set release date
        id: date
        run: echo "date=$(TZ='Europe/London' date +'%d/%m/%Y')" >> "$GITHUB_OUTPUT"

      - name: Delete previous release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view NBOSP-PREBUILT --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name' | while read -r asset; do
            gh release delete-asset NBOSP-PREBUILT "$asset" --repo "${{ github.repository }}" -y || true
          done

      - name: Upload new release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload NBOSP-PREBUILT \
            artifacts/NovaByte-win-x64.zip \
            artifacts/NovaByte-linux-x64.zip \
            artifacts/NovaByte-osx-arm64.zip \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Update release notes with date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit NBOSP-PREBUILT --repo "${{ github.repository }}" --notes "Pre-built cross-platform binaries for NovaByte, built directly from the current NBOSP source (no cloning or \`npm install\` required — just download and run).

          Updated as of ${{ steps.date.outputs.date }}. This release is updated in place as NBOSP changes — binaries reflect the latest source as of the date above, not a fixed version snapshot.

          Available builds:
          - Windows (x64)
          - Linux (x64)
          - macOS (Apple Silicon / arm64)

          No installation needed — extract and run the executable for your platform."