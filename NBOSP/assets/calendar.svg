<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Calendar icon">
  <defs>
    
    <linearGradient id="ca-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>

    
    <linearGradient id="ca-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cffafe"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>

    
    <linearGradient id="ca-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    
    <clipPath id="ca-clip">
      <rect x="14" y="21" width="68" height="61" rx="9"/>
    </clipPath>

    
    <filter id="ca-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  
  <g filter="url(#ca-ds)">
    <g clip-path="url(#ca-clip)">
      
      <rect x="14" y="21" width="68" height="61" rx="9" fill="url(#ca-body)"/>

      
      <rect x="14" y="21" width="68" height="17" fill="url(#ca-top)"/>
      <rect x="14" y="37" width="68" height="2" fill="#164e63" opacity="0.28"/>

      
      <rect x="24" y="47" width="11" height="10" rx="3" fill="#164e63" opacity="0.32"/>
      <rect x="42.5" y="47" width="11" height="10" rx="3" fill="#164e63" opacity="0.32"/>
      <rect x="61" y="47" width="11" height="10" rx="3" fill="#164e63" opacity="0.32"/>
      <rect x="24" y="63" width="11" height="10" rx="3" fill="#164e63" opacity="0.32"/>
      <rect x="42.5" y="63" width="11" height="10" rx="3" fill="#164e63" opacity="0.32"/>
    </g>

    
    <path d="M23 21.8 H73" fill="none" stroke="#ecfeff" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  </g>

  
  <g filter="url(#ca-ds)">
    
    <rect x="26.5" y="14" width="6" height="14" rx="3" fill="url(#ca-amber)"/>
    <rect x="63.5" y="14" width="6" height="14" rx="3" fill="url(#ca-amber)"/>

    
    <rect x="61" y="63" width="11" height="10" rx="3" fill="url(#ca-amber)"/>
