<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Quote icon">
  <defs>
    <!-- Primary 3-stop vibrant red gradient -->
    <linearGradient id="qt-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset="0.55" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Lighter highlight gradient (matching the cylinder lid) -->
    <linearGradient id="qt-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fee2e2"/>
      <stop offset="1" stop-color="#fca5a5"/>
    </linearGradient>

    <!-- Warm amber accent gradient for the foreground quote mark -->
    <linearGradient id="qt-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Proportional drop shadow for 96x96 viewBox -->
    <filter id="qt-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Borderless double quotation marks with soft drop shadow -->
  <g filter="url(#qt-ds)">
    <!-- Left quotation mark (3-stop crimson gradient with softened corners) -->
    <path d="M16 20h28v25c0 17-9 27.5-28 32.5V63.5c7.5-3.5 11.5-8.5 12.5-15.5H16z" fill="url(#qt-body)" stroke="url(#qt-body)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Subtle top gloss highlight on the left quote block -->
    <rect x="21" y="24" width="18" height="3.8" rx="1.9" fill="url(#qt-top)" opacity="0.8"/>

    <!-- Right quotation mark (warm amber accent with secondary drop shadow) -->
    <g filter="url(#qt-ds)">
      <path d="M52 20h28v25c0 17-9 27.5-28 32.5V63.5c7.5-3.5 11.5-8.5 12.5-15.5H52z" fill="url(#qt-accent)" stroke="url(#qt-accent)" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Subtle translucent warm highlight bar -->
      <rect x="57" y="24" width="18" height="3.8" rx="1.9" fill="#fef9c3" opacity="0.65"/>
    </g>
  </g>
</svg>
