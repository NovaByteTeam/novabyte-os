<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Plus Math icon">
  <defs>
    <linearGradient id="plus-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="plus-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="plus-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="plus-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Main teal tile body -->
  <g filter="url(#plus-ds)">
    <!-- Borderless 3-stop teal rounded square -->
    <rect x="15" y="15" width="66" height="66" rx="17" fill="url(#plus-body)"/>

    <!-- Recessed outer bezel groove -->
    <rect x="20" y="20" width="56" height="56" rx="13" fill="none" stroke="#115e59" stroke-width="1.6" opacity="0.38"/>

    <!-- Top highlight inner plate -->
    <rect x="24" y="24" width="48" height="48" rx="10" fill="url(#plus-top)"/>
    <rect x="24" y="24" width="48" height="48" rx="10" fill="none" stroke="#0f766e" stroke-width="1.2" opacity="0.35"/>
  </g>

  <!-- Foreground warm amber plus sign (single unified path so drop-shadow doesn't overlap at the center) -->
  <g filter="url(#plus-ds)">
    <path d="M44 33 A4 4 0 0 1 52 33 V44 H63 A4 4 0 0 1 63 52 H52 V63 A4 4 0 0 1 44 63 V52 H33 A4 4 0 0 1 33 44 H44 Z" fill="url(#plus-amber)"/>
  </g>
</svg>
