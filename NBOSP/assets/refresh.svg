<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Refresh icon">
  <defs>
    <!-- Primary 3-stop vibrant teal gradient -->
    <linearGradient id="ref-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Lighter highlight gradient (matching the cylinder lid) -->
    <linearGradient id="ref-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>

    <!-- Warm amber accent gradient for the lower return arrow -->
    <linearGradient id="ref-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Proportional drop shadow for 96x96 viewBox -->
    <filter id="ref-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Borderless circular refresh arrows with soft drop shadow -->
  <g filter="url(#ref-ds)">
    <!-- Upper arc: sweeps clockwise from top-left to top-right (3-stop teal gradient) -->
    <path d="M23 36A28 28 0 0 1 73 36" fill="none" stroke="url(#ref-body)" stroke-width="8.5" stroke-linecap="round"/>
    <!-- Upper arrowhead pointing down-right at (73, 36) -->
    <path d="M74 22v15H59" fill="none" stroke="url(#ref-body)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Concentric glossy top highlight along the teal upper arc -->
    <path d="M24 35.5A28 28 0 0 1 72 35.5" fill="none" stroke="url(#ref-top)" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

    <!-- Lower return arc: sweeps clockwise from bottom-right to bottom-left (warm amber with secondary drop shadow) -->
    <g filter="url(#ref-ds)">
      <path d="M73 60A28 28 0 0 1 23 60" fill="none" stroke="url(#ref-accent)" stroke-width="8.5" stroke-linecap="round"/>
      <!-- Lower arrowhead pointing up-left at (23, 60) -->
      <path d="M22 74V59h15" fill="none" stroke="url(#ref-accent)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
