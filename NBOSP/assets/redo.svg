<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Redo icon">
  <defs>
    <!-- Primary 3-stop vibrant purple gradient -->
    <linearGradient id="rdo-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Lighter highlight gradient (matching the cylinder lid) -->
    <linearGradient id="rdo-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>

    <!-- Warm amber accent gradient for the floating arrowhead -->
    <linearGradient id="rdo-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Proportional drop shadow for 96x96 viewBox -->
    <filter id="rdo-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Borderless redo U-turn arrow with soft drop shadow -->
  <g filter="url(#rdo-ds)">
    <!-- U-turn curved shaft (sweeps left and up toward top-right) -->
    <path d="M58 68H37a20 20 0 0 1 0-40h21" fill="none" stroke="url(#rdo-body)" stroke-width="11" stroke-linecap="round"/>

    <!-- Concentric glossy inner highlight along the purple U-turn curve -->
    <path d="M56 68H37a20 20 0 0 1 0-40h19" fill="none" stroke="url(#rdo-top)" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>

    <!-- Floating warm amber right-pointing arrowhead with secondary drop shadow -->
    <g filter="url(#rdo-ds)">
      <path d="M56 14.5 L77 28 L56 41.5 Z" fill="url(#rdo-accent)" stroke="url(#rdo-accent)" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
