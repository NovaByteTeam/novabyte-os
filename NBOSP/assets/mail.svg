<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Mail icon">
  <defs>
    <linearGradient id="ml-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="0.55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="ml-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fce7f3"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="ml-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="ml-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
    <clipPath id="ml-clip">
      <rect x="12" y="22" width="72" height="52" rx="10"/>
    </clipPath>
  </defs>

  
  <g filter="url(#ml-ds)">
    <g clip-path="url(#ml-clip)">
      <rect x="12" y="22" width="72" height="52" rx="10" fill="url(#ml-body)"/>
      
      <path d="M12 74 L39 51 M84 74 L57 51" fill="none" stroke="#831843" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
      
      <path d="M12 22 H84 V26 L48 53 L12 26 Z" fill="url(#ml-top)" opacity="0.72"/>
      <path d="M12 26 L48 53 L84 26" fill="none" stroke="#831843" stroke-width="2.2" stroke-linejoin="round" opacity="0.32"/>
    </g>
  </g>

  
  <g filter="url(#ml-ds)">
    <path d="M19 29 L48 50.5 L77 29" fill="none" stroke="url(#ml-accent)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="50.5" r="6.5" fill="url(#ml-accent)"/>
  </g>
</svg>
