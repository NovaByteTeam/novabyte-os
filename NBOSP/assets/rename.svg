<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Rename icon">
  <defs>
    <!-- Primary 3-stop vibrant pink gradient -->
    <linearGradient id="rn-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="0.55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>

    <!-- Lighter highlight gradient (matching the cylinder lid) -->
    <linearGradient id="rn-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fce7f3"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>

    <!-- Warm amber accent gradient for the floating pencil -->
    <linearGradient id="rn-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Proportional drop shadow for 96x96 viewBox -->
    <filter id="rn-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Borderless rename input card & floating pencil with soft drop shadow -->
  <g filter="url(#rn-ds)">
    <!-- Input field card (centred cleanly inside 96x96 safe area) -->
    <rect x="12" y="21" width="64" height="52" rx="9" fill="url(#rn-body)"/>

    <!-- Subtle inner border groove (mirroring cylinder rim detail) -->
    <rect x="16.5" y="25.5" width="55" height="43" rx="6" fill="none" stroke="#831843" stroke-width="2" opacity="0.35"/>

    <!-- Top gloss highlight bar -->
    <path d="M23 23.5h42" fill="none" stroke="url(#rn-top)" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

    <!-- Solid rounded text bars inside the input field -->
    <rect x="23" y="38" width="28" height="4.5" rx="2.25" fill="url(#rn-top)"/>
    <rect x="23" y="49.5" width="19" height="4.5" rx="2.25" fill="url(#rn-top)" opacity="0.85"/>

    <!-- Floating warm amber pencil with seamless joined segments -->
    <g filter="url(#rn-ds)" transform="translate(65 55) rotate(-45)">
      <!-- Unified pencil body + rounded eraser cap -->
      <rect x="-11" y="-5" width="31" height="10" rx="2.5" fill="url(#rn-accent)"/>
      <!-- Dark translucent ferrule band separating barrel and eraser -->
      <rect x="11.5" y="-5" width="2.4" height="10" fill="#92400e" opacity="0.45"/>
      <!-- Sharpened cone joined flush at x=-10.5 (no gap) -->
      <path d="M-10.5 -5 L-21 0 L-10.5 5 Z" fill="url(#rn-accent)"/>
      <!-- Flush graphite lead tip -->
      <path d="M-17.2 -1.8 L-21 0 L-17.2 1.8 Z" fill="#831843" opacity="0.75"/>
    </g>
  </g>
</svg>
