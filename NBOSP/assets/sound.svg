<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Sound icon">
  <defs>
    <!-- Primary 3-stop vibrant purple gradient -->
    <linearGradient id="snd-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Lighter highlight gradient (matching the cylinder lid) -->
    <linearGradient id="snd-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>

    <!-- Warm amber accent gradient for the sound waves -->
    <linearGradient id="snd-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Proportional drop shadow for 96x96 viewBox -->
    <filter id="snd-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Borderless speaker and sound waves with soft drop shadow -->
  <g filter="url(#snd-ds)">
    <!-- Speaker cabinet & cone with subtly softened corners -->
    <path d="M14 39h16l22-18v54L30 57H14z" fill="url(#snd-body)" stroke="url(#snd-body)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Subtle translucent seam between speaker box and cone (mirroring the cylinder rings) -->
    <path d="M30 38.5v19" fill="none" stroke="#4c1d95" stroke-width="2.2" stroke-linecap="round" opacity="0.4"/>

    <!-- Top edge highlight on the speaker housing -->
    <path d="M15.5 38.5h14l20-16.5" fill="none" stroke="url(#snd-top)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

    <!-- Floating warm amber sound waves with secondary drop shadow -->
    <g filter="url(#snd-ds)" fill="none" stroke="url(#snd-accent)" stroke-linecap="round">
      <path d="M60 34a21 21 0 0 1 0 28" stroke-width="6"/>
      <path d="M68 23a32 32 0 0 1 0 50" stroke-width="6"/>
    </g>
  </g>
</svg>
