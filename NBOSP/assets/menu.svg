<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Menu icon">
  <defs>
    <linearGradient id="mn-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="0.55" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="mn-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="mn-bar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="mn-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
    <clipPath id="mn-clip">
      <rect x="14" y="20" width="68" height="56" rx="12"/>
    </clipPath>
  </defs>

  <!-- menu card base -->
  <g filter="url(#mn-ds)">
    <g clip-path="url(#mn-clip)">
      <rect x="14" y="20" width="68" height="56" rx="12" fill="url(#mn-body)"/>
      <rect x="14" y="20" width="68" height="10" fill="url(#mn-top)" opacity="0.55"/>
      <rect x="15.5" y="21.5" width="65" height="53" rx="10.5" fill="none" stroke="#14532d" stroke-width="1.5" opacity="0.35"/>
    </g>
  </g>

  <!-- foreground menu bars -->
  <g filter="url(#mn-ds)">
    <rect x="28" y="32.5" width="40" height="5.5" rx="2.75" fill="url(#mn-bar)"/>
    <rect x="28" y="45.25" width="40" height="5.5" rx="2.75" fill="url(#mn-bar)"/>
    <rect x="28" y="58" width="40" height="5.5" rx="2.75" fill="url(#mn-bar)"/>
  </g>
</svg>
