<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Edit Pencil icon">
  <defs>
    <linearGradient id="pn-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="0.55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="pn-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fce7f3"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="pn-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="pn-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
    <clipPath id="pn-shaft-clip">
      <rect x="-18" y="-8.5" width="36" height="17"/>
    </clipPath>
    <clipPath id="pn-tip-clip">
      <path d="M-16 -8.5 H-18 L-35.5 -1.1 A1.2 1.2 0 0 0 -35.5 1.1 L-18 8.5 H-16 Z"/>
    </clipPath>
  </defs>

  <g transform="translate(48 48) rotate(-45)">
    
    <g filter="url(#pn-ds)">
      <g clip-path="url(#pn-shaft-clip)">
        <rect x="-18" y="-8.5" width="36" height="17" fill="url(#pn-body)"/>
        
        <rect x="-18" y="-8.5" width="36" height="5.5" fill="url(#pn-top)" opacity="0.6"/>
        
        <rect x="-18" y="2.2" width="36" height="1.8" fill="#831843" opacity="0.32"/>
      </g>
    </g>

    
    <g filter="url(#pn-ds)">
      <g clip-path="url(#pn-tip-clip)">
        <path d="M-16 -8.5 H-18 L-35.5 -1.1 A1.2 1.2 0 0 0 -35.5 1.1 L-18 8.5 H-16 Z" fill="url(#pn-amber)"/>
        
        <rect x="-38" y="-8.5" width="7.5" height="17" fill="#92400e" opacity="0.55"/>
        <rect x="-18.5" y="-8.5" width="2.5" height="17" fill="#92400e" opacity="0.35"/>
      </g>

      
      <rect x="19" y="-8.5" width="16" height="17" rx="5.5" fill="url(#pn-amber)"/>
      
      <rect x="15.5" y="-9" width="6.5" height="18" rx="2" fill="url(#pn-amber)"/>
      <rect x="17.8" y="-9" width="1.9" height="18" fill="#92400e" opacity="0.35"/>
    </g>
  </g>
</svg>
