<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Edit Property icon">
  <defs>
    <linearGradient id="ep-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="0.55" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="ep-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="ep-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="ep-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
    <clipPath id="ep-clip">
      <rect x="15" y="15" width="66" height="66" rx="10"/>
    </clipPath>
  </defs>

  <!-- green property control card -->
  <g filter="url(#ep-ds)">
    <g clip-path="url(#ep-clip)">
      <rect x="15" y="15" width="66" height="66" rx="10" fill="url(#ep-body)"/>
      <!-- top highlight bevel -->
      <rect x="15" y="15" width="66" height="10" fill="url(#ep-top)" opacity="0.55"/>
      <!-- recessed inner rim -->
      <rect x="16.5" y="16.5" width="63" height="63" rx="8.5" fill="none" stroke="#14532d" stroke-width="1.5" opacity="0.35"/>
      <!-- recessed horizontal slider tracks -->
      <rect x="26" y="29" width="44" height="4" rx="2" fill="#14532d" opacity="0.38"/>
      <rect x="26" y="46" width="44" height="4" rx="2" fill="#14532d" opacity="0.38"/>
      <rect x="26" y="63" width="44" height="4" rx="2" fill="#14532d" opacity="0.38"/>
    </g>
  </g>

  <!-- foreground warm amber slider knobs -->
  <g filter="url(#ep-ds)">
    <circle cx="41" cy="31" r="5.5" fill="url(#ep-amber)"/>
    <circle cx="41" cy="31" r="2" fill="#92400e" opacity="0.4"/>

    <circle cx="58" cy="48" r="5.5" fill="url(#ep-amber)"/>
    <circle cx="58" cy="48" r="2" fill="#92400e" opacity="0.4"/>

    <circle cx="35" cy="65" r="5.5" fill="url(#ep-amber)"/>
    <circle cx="35" cy="65" r="2" fill="#92400e" opacity="0.4"/>
  </g>
</svg>
