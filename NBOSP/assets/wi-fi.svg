<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Wi Fi icon">
  <defs>
    <!-- Primary 3-stop sky-blue gradient matching your NovaReg palette -->
    <linearGradient id="wf-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Lighter highlight gradient -->
    <linearGradient id="wf-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Warm amber accent gradient -->
    <linearGradient id="wf-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Proportional drop shadow for 96x96 viewBox -->
    <filter id="wf-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Borderless Wi-Fi waves and dot with soft drop shadow -->
  <g filter="url(#wf-ds)">
    <!-- Signal arcs -->
    <path d="M12 34a52 52 0 0 1 72 0" fill="none" stroke="url(#wf-body)" stroke-width="8" stroke-linecap="round"/>
    <path d="M22 47a37 37 0 0 1 52 0" fill="none" stroke="url(#wf-body)" stroke-width="8" stroke-linecap="round"/>
    <path d="M32 60a22 22 0 0 1 32 0" fill="none" stroke="url(#wf-body)" stroke-width="8" stroke-linecap="round"/>

    <!-- Subtle inner highlight arc (mirroring the cylinder rim detail) -->
    <path d="M18 33a48 48 0 0 1 60 0" fill="none" stroke="url(#wf-top)" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

    <!-- Warm amber signal dot -->
    <circle cx="48" cy="73" r="7.5" fill="url(#wf-accent)"/>
  </g>
</svg>
