<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Calculator icon">
  <defs>
    <!-- 3-stop vertical emerald-green gradient matching incoming hue -->
    <linearGradient id="cc-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="0.55" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>

    <!-- Lighter mint-green digital LCD display screen gradient -->
    <linearGradient id="cc-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>

    <!-- Warm amber gradient for foreground display readout & equals key -->
    <linearGradient id="cc-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Proportional NovaReg drop shadow -->
    <filter id="cc-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Main Calculator Chassis -->
  <g filter="url(#cc-ds)">
    <!-- Rounded emerald casing strictly inside 10-86 safe zone -->
    <rect x="23" y="12" width="50" height="72" rx="10" fill="url(#cc-body)"/>
    <!-- Crisp top-edge specular highlight -->
    <path d="M33 12.8 H63" fill="none" stroke="#f0fdf4" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>

    <!-- Recessed mint LCD screen & subtle inner groove -->
    <rect x="30" y="19" width="36" height="16" rx="4" fill="url(#cc-screen)"/>
    <rect x="30" y="19" width="36" height="16" rx="4" fill="none" stroke="#14532d" stroke-width="1.2" opacity="0.28"/>

    <!-- Recessed keypad buttons (rows 1-3, cols 1-3) -->
    <!-- Row 1 -->
    <rect x="30" y="41" width="10" height="9.5" rx="3" fill="#14532d" opacity="0.32"/>
    <rect x="43" y="41" width="10" height="9.5" rx="3" fill="#14532d" opacity="0.32"/>
    <rect x="56" y="41" width="10" height="9.5" rx="3" fill="#14532d" opacity="0.32"/>

    <!-- Row 2 -->
    <rect x="30" y="54.5" width="10" height="9.5" rx="3" fill="#14532d" opacity="0.32"/>
    <rect x="43" y="54.5" width="10" height="9.5" rx="3" fill="#14532d" opacity="0.32"/>
    <rect x="56" y="54.5" width="10" height="9.5" rx="3" fill="#14532d" opacity="0.32"/>

    <!-- Row 3 (left & middle keys) -->
    <rect x="30" y="68" width="10" height="9.5" rx="3" fill="#14532d" opacity="0.32"/>
    <rect x="43" y="68" width="10" height="9.5" rx="3" fill="#14532d" opacity="0.32"/>
  </g>

  <!-- Warm amber foreground readout bar & elevated equals (`=`) key -->
  <g filter="url(#cc-ds)">
    <!-- LCD readout pill inside screen -->
    <rect x="35" y="25.2" width="17" height="3.6" rx="1.8" fill="url(#cc-amber)"/>
    <!-- Featured bottom-right equals key -->
    <rect x="56" y="68" width="10" height="9.5" rx="3" fill="url(#cc-amber)"/>
  </g>
</svg>
