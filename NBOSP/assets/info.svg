<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Info icon">
  <defs>
    <linearGradient id="in-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="in-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cffafe"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="in-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="in-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
    <clipPath id="in-clip">
      <circle cx="48" cy="48" r="34"/>
    </clipPath>
  </defs>

  <!-- cyan badge disc -->
  <g filter="url(#in-ds)">
    <g clip-path="url(#in-clip)">
      <circle cx="48" cy="48" r="34" fill="url(#in-body)"/>
      <!-- top highlight bevel -->
      <ellipse cx="48" cy="24" rx="30" ry="13" fill="url(#in-top)" opacity="0.5"/>
      <!-- recessed inner ring -->
      <circle cx="48" cy="48" r="28.5" fill="none" stroke="#164e63" stroke-width="1.8" opacity="0.35"/>
    </g>
  </g>

  <!-- foreground warm amber info glyph -->
  <g filter="url(#in-ds)">
    <circle cx="48" cy="30.5" r="4" fill="url(#in-accent)"/>
    <rect x="44.5" y="40" width="7" height="27" rx="3.5" fill="url(#in-accent)"/>
  </g>
</svg>
