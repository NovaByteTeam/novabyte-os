<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Gear icon">
  <defs>
    <linearGradient id="gr-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="gr-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="gr-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="gr-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
    <clipPath id="gr-gear-clip">
      <rect x="43" y="14" width="10" height="68" rx="3.2"/>
      <rect x="43" y="14" width="10" height="68" rx="3.2" transform="rotate(45 48 48)"/>
      <rect x="43" y="14" width="10" height="68" rx="3.2" transform="rotate(90 48 48)"/>
      <rect x="43" y="14" width="10" height="68" rx="3.2" transform="rotate(135 48 48)"/>
      <circle cx="48" cy="48" r="26"/>
    </clipPath>
    <clipPath id="gr-wheel-clip">
      <circle cx="48" cy="48" r="26"/>
    </clipPath>
  </defs>

  <!-- symmetric 8-tooth teal gear body with single un-rotated vertical gradient -->
  <g filter="url(#gr-ds)">
    <g clip-path="url(#gr-gear-clip)">
      <rect x="14" y="14" width="68" height="68" fill="url(#gr-body)"/>
    </g>

    <!-- main gear wheel & clipped highlights -->
    <g clip-path="url(#gr-wheel-clip)">
      <!-- top highlight bevel -->
      <ellipse cx="48" cy="29" rx="23" ry="10" fill="url(#gr-top)" opacity="0.55"/>
      <!-- recessed inner bevel ring -->
      <circle cx="48" cy="48" r="21.5" fill="none" stroke="#115e59" stroke-width="2" opacity="0.35"/>
    </g>
  </g>

  <!-- foreground warm amber central hub -->
  <g filter="url(#gr-ds)">
    <circle cx="48" cy="48" r="14.5" fill="url(#gr-amber)"/>
    <circle cx="48" cy="48" r="8.5" fill="none" stroke="#92400e" stroke-width="2" opacity="0.35"/>
    <circle cx="48" cy="48" r="4.5" fill="#92400e" opacity="0.45"/>
  </g>
</svg>
