<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Dice icon">
  <defs>
    <!-- Top face highlight gradient (warm coral-red illumination) -->
    <linearGradient id="dc-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fecaca"/>
      <stop offset="1" stop-color="#f87171"/>
    </linearGradient>

    <!-- Left face 3-stop vertical crimson-red gradient -->
    <linearGradient id="dc-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset="0.55" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Right face deeper 3-stop vertical crimson gradient for 3D shading -->
    <linearGradient id="dc-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="0.55" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Vertical warm amber gradient for consistent top-lit dice pips -->
    <linearGradient id="dc-pip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Proportional NovaReg drop shadow -->
    <filter id="dc-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Isometric 3D Dice Body -->
  <g filter="url(#dc-ds)">
    <!-- Full base silhouette prevents any sub-pixel anti-aliasing seams between facets -->
    <path d="M48 13 L81 31 V67 L48 85 L15 67 V31 Z" fill="url(#dc-left)"/>

    <!-- Top diamond facet (exact ±18/33 isometric slopes) -->
    <path d="M48 13 L81 31 L48 49 L15 31 Z" fill="url(#dc-top)"/>

    <!-- Right shaded facet (parallel vertical & ±18/33 isometric slopes) -->
    <path d="M48 49 L81 31 V67 L48 85 Z" fill="url(#dc-right)"/>

    <!-- Crisp top-edge specular ridge & subtle vertical center bevel -->
    <path d="M16.5 31 L48 48.2 L79.5 31" fill="none" stroke="#fff1f2" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
    <path d="M48 49 V83.5" fill="none" stroke="#fee2e2" stroke-width="1" stroke-linecap="round" opacity="0.22"/>
  </g>

  <!-- Warm amber foreground pips with secondary elevation -->
  <g filter="url(#dc-ds)">
    <!-- Top face pips (2 pips along vertical isometric diagonal) -->
    <ellipse cx="48" cy="24.5" rx="3.4" ry="2.1" fill="url(#dc-pip)"/>
    <ellipse cx="48" cy="37.5" rx="3.4" ry="2.1" fill="url(#dc-pip)"/>

    <!-- Left face pips (2 pips) -->
    <ellipse cx="25.5" cy="48.5" rx="2.6" ry="3.4" transform="rotate(-28 25.5 48.5)" fill="url(#dc-pip)"/>
    <ellipse cx="37.5" cy="66.5" rx="2.6" ry="3.4" transform="rotate(-28 37.5 66.5)" fill="url(#dc-pip)"/>

    <!-- Right face pips (3 pips) -->
    <ellipse cx="58.5" cy="66.5" rx="2.6" ry="3.4" transform="rotate(28 58.5 66.5)" fill="url(#dc-pip)"/>
    <ellipse cx="64.5" cy="58" rx="2.6" ry="3.4" transform="rotate(28 64.5 58)" fill="url(#dc-pip)"/>
    <ellipse cx="70.5" cy="49.5" rx="2.6" ry="3.4" transform="rotate(28 70.5 49.5)" fill="url(#dc-pip)"/>
  </g>
</svg>
