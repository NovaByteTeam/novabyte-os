<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Rating icon">
  <defs>
    <!-- Primary 3-stop sky-blue gradient matching your NovaReg palette -->
    <linearGradient id="rt-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Lighter highlight gradient (matching the cylinder lid) -->
    <linearGradient id="rt-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Warm amber accent gradient for the floating inner rating star -->
    <linearGradient id="rt-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Proportional drop shadow for 96x96 viewBox -->
    <filter id="rt-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Borderless rating star with soft drop shadow -->
  <g filter="url(#rt-ds)">
    <!-- Outer sky-blue star base with softly rounded tips -->
    <path d="M48 12.5 L58.4 33.8 L81.8 37.2 L64.9 53.6 L68.9 76.9 L48 65.9 L27.1 76.9 L31.1 53.6 L14.2 37.2 L37.6 33.8 Z" fill="url(#rt-body)" stroke="url(#rt-body)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Subtle translucent inner bevel ring (mirroring cylinder rim detail) -->
    <path d="M48 18.5 L56.4 35.7 L75.3 38.4 L61.6 51.7 L64.8 70.5 L48 61.6 L31.2 70.5 L34.4 51.7 L20.7 38.4 L39.6 35.7 Z" fill="none" stroke="#1e3a8a" stroke-width="1.8" stroke-linejoin="round" opacity="0.35"/>

    <!-- Floating warm amber inner star emblem with secondary drop shadow -->
    <g filter="url(#rt-ds)">
      <path d="M48 25.5 L54.2 38.1 L68.1 40.1 L58 49.9 L60.4 63.7 L48 57.2 L35.6 63.7 L38 49.9 L27.9 40.1 L41.8 38.1 Z" fill="url(#rt-accent)" stroke="url(#rt-accent)" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
