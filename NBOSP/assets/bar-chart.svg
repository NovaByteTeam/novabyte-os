<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Bar Chart icon">
  <defs>
    <!-- 3-stop vertical sky-blue gradient matching NovaReg primary palette -->
    <linearGradient id="bc-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Lighter ice-blue top cap highlight gradient -->
    <linearGradient id="bc-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Warm amber gradient for foreground featured middle bar & baseline -->
    <linearGradient id="bc-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Proportional NovaReg drop shadow -->
    <filter id="bc-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Primary Sky-Blue Chart Bars -->
  <g filter="url(#bc-ds)">
    <!-- Left bar -->
    <rect x="17" y="48" width="16" height="28" rx="5" fill="url(#bc-body)"/>
    <path d="M22 48.8 H28" fill="none" stroke="url(#bc-top)" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
    <!-- Recessed inner tick groove -->
    <rect x="22.5" y="54" width="5" height="2.4" rx="1.2" fill="#1e3a8a" opacity="0.35"/>

    <!-- Right bar -->
    <rect x="63" y="16" width="16" height="60" rx="5" fill="url(#bc-body)"/>
    <path d="M68 16.8 H74" fill="none" stroke="url(#bc-top)" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
    <!-- Recessed inner tick grooves -->
    <rect x="68.5" y="23" width="5" height="2.4" rx="1.2" fill="#1e3a8a" opacity="0.35"/>
    <rect x="68.5" y="30" width="5" height="2.4" rx="1.2" fill="#1e3a8a" opacity="0.35"/>
  </g>

  <!-- Warm amber foreground focal middle bar & base axis pill with secondary elevation -->
  <g filter="url(#bc-ds)">
    <!-- Highlighted center bar -->
    <rect x="40" y="32" width="16" height="44" rx="5" fill="url(#bc-amber)"/>
    <!-- Rounded baseline axis pill -->
    <rect x="13" y="79" width="70" height="5" rx="2.5" fill="url(#bc-amber)"/>
  </g>
</svg>
