<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Processor icon">
  <defs>
    <linearGradient id="cpu-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="0.55" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="cpu-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="cpu-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="cpu-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  
  <g filter="url(#cpu-ds)">
    
    <g fill="url(#cpu-amber)">
      
      <rect x="31.5" y="13" width="5" height="13" rx="2.5"/>
      <rect x="45.5" y="13" width="5" height="13" rx="2.5"/>
      <rect x="59.5" y="13" width="5" height="13" rx="2.5"/>
      
      <rect x="31.5" y="70" width="5" height="13" rx="2.5"/>
      <rect x="45.5" y="70" width="5" height="13" rx="2.5"/>
      <rect x="59.5" y="70" width="5" height="13" rx="2.5"/>
      
      <rect x="13" y="31.5" width="13" height="5" rx="2.5"/>
      <rect x="13" y="45.5" width="13" height="5" rx="2.5"/>
      <rect x="13" y="59.5" width="13" height="5" rx="2.5"/>
      
      <rect x="70" y="31.5" width="13" height="5" rx="2.5"/>
      <rect x="70" y="45.5" width="13" height="5" rx="2.5"/>
      <rect x="70" y="59.5" width="13" height="5" rx="2.5"/>
    </g>

    
    <rect x="23" y="23" width="50" height="50" rx="9" fill="url(#cpu-body)"/>

    
    <rect x="27.5" y="27.5" width="41" height="41" rx="6.5" fill="none" stroke="#14532d" stroke-width="1.6" opacity="0.38"/>

    
    <rect x="33" y="33" width="30" height="30" rx="5.5" fill="url(#cpu-top)"/>
    <rect x="33" y="33" width="30" height="30" rx="5.5" fill="none" stroke="#15803d" stroke-width="1.2" opacity="0.4"/>
  </g>

  
  <g filter="url(#cpu-ds)" fill="url(#cpu-amber)">
    <rect x="38" y="42" width="20" height="4" rx="2"/>
    <rect x="38" y="50" width="13" height="4" rx="2"/>
  </g>
</svg>
