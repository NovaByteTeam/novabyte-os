  <g filter="url(#sd-ds)">
    
    <path d="M31 24.5a30 30 0 1 0 34 0" fill="none" stroke="url(#sd-body)" stroke-width="9" stroke-linecap="round"/>

    
    <path d="M31 24.5a30 30 0 1 0 34 0" fill="none" stroke="url(#sd-top)" stroke-width="2" stroke-linecap="round" opacity="0.65"/>

    
    <g filter="url(#sd-ds)">
      <rect x="43.25" y="9.5" width="9.5" height="42" rx="4.75" fill="url(#sd-accent)"/>
    </g>
