      <line x1="36" y1="49" x2="60" y2="49" stroke="#7f1d1d" stroke-width="2" opacity="0.35"/>
      <line x1="36" y1="56" x2="60" y2="56" stroke="#7f1d1d" stroke-width="2" opacity="0.35"/>
