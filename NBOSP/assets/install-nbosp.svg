<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Install NovaByte icon">
  <defs>
    <linearGradient id="in-monitor" x2="0" y2="1"><stop stop-color="#445b9a"/><stop offset="1" stop-color="#16264c"/></linearGradient>
    <linearGradient id="in-screen" x2="0" y2="1"><stop stop-color="#d9f7ff"/><stop offset="1" stop-color="#75c5ef"/></linearGradient>
  </defs>
  <ellipse cx="48" cy="82" rx="33" ry="6" fill="#102442" opacity=".23"/>
  
  <!-- Monitor stand (centred on x=47) -->
  <path d="M39 61h16l4 10H35z" fill="#4a5e91"/>
  <path d="M29 71h36a4 4 0 0 1 4 4v2H25v-2a4 4 0 0 1 4-4z" fill="#253b70"/>
  
  <!-- Monitor shadow, frame & screen -->
  <rect x="12" y="16" width="72" height="48" rx="8" fill="#14254a"/>
  <rect x="11" y="13" width="72" height="48" rx="8" fill="url(#in-monitor)"/>
  <rect x="17" y="19" width="60" height="35" rx="4" fill="url(#in-screen)"/>
  
  <!-- Centred download arrow & inner highlight -->
