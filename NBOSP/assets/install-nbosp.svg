  <path d="M45 27h4v11" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  
  <!-- Success badge -->
  <circle cx="67" cy="48" r="7" fill="#22c55e"/>
  <path d="m64 48 2 2 4-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
