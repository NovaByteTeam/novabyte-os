<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Paste icon">
  <defs>
    <!-- 3-stop vertical warm gold/amber base gradient -->
    <linearGradient id="pt-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>

    <!-- Lighter top highlight gradient -->
    <linearGradient id="pt-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>

    <!-- Sky-blue foreground accent gradient (used because base is gold/amber) -->
    <linearGradient id="pt-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Proportional NovaReg drop shadow -->
    <filter id="pt-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>

    <!-- Clipped silhouette for inner board details -->
    <clipPath id="pt-board-clip">
      <rect x="21" y="21" width="54" height="62" rx="8"/>
    </clipPath>
  </defs>

  <!-- Clipboard base with borderless depth -->
  <g filter="url(#pt-ds)">
    <rect x="21" y="21" width="54" height="62" rx="8" fill="url(#pt-body)"/>

    <!-- Clipped inner top sheen, recessed sheet inset, and text lines -->
    <g clip-path="url(#pt-board-clip)">
      <rect x="21" y="21" width="54" height="22" fill="url(#pt-top)"/>
      <rect x="26" y="27" width="44" height="51" rx="5" fill="none" stroke="#92400e" stroke-width="1.8" opacity="0.36"/>
      <rect x="33" y="42" width="30" height="3.2" rx="1.6" fill="#92400e" opacity="0.42"/>
      <rect x="33" y="53" width="30" height="3.2" rx="1.6" fill="#92400e" opacity="0.42"/>
      <rect x="33" y="64" width="21" height="3.2" rx="1.6" fill="#92400e" opacity="0.42"/>
    </g>
  </g>

  <!-- Sky-blue foreground clipboard clasp overlapping the top edge seamlessly -->
  <g filter="url(#pt-ds)">
    <!-- Handle loop tucked slightly into the clasp body -->
    <path d="M40 16 v-2.5 a3.5 3.5 0 0 1 3.5 -3.5 h9 a3.5 3.5 0 0 1 3.5 3.5 v2.5" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Main clasp bar overlapping the board top (y: 14 to 27) -->
    <rect x="34" y="14" width="28" height="13" rx="5.5" fill="url(#pt-accent)"/>
    <!-- Subtle inner highlight pill on the clasp -->
    <rect x="38" y="16.5" width="20" height="2.4" rx="1.2" fill="#bae6fd" opacity="0.7"/>
  </g>
</svg>
