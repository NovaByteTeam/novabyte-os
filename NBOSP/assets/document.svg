<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Document icon">
  <defs>
    <!-- 3-stop vertical sky-blue gradient matching NovaReg primary palette -->
    <linearGradient id="dm-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Warm amber gradient for foreground folded corner & header accent -->
    <linearGradient id="dm-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Proportional NovaReg drop shadow -->
    <filter id="dm-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Main document sheet -->
  <g filter="url(#dm-ds)">
    <path d="M26 12h31l17 17v49a6 6 0 0 1-6 6H26a6 6 0 0 1-6-6V18a6 6 0 0 1 6-6z" fill="url(#dm-body)"/>
    <!-- Crisp top-edge highlight -->
    <path d="M26 12.8h29.8" fill="none" stroke="#bae6fd" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>

    <!-- Recessed text lines -->
    <rect x="29" y="42" width="36" height="4" rx="2" fill="#1e3a8a" opacity="0.38"/>
    <rect x="29" y="53" width="36" height="4" rx="2" fill="#1e3a8a" opacity="0.38"/>
    <rect x="29" y="64" width="25" height="4" rx="2" fill="#1e3a8a" opacity="0.38"/>
  </g>

  <!-- Warm amber folded dog-ear corner & header accent pill with secondary drop shadow -->
  <g filter="url(#dm-ds)">
    <path d="M57 12v13a4 4 0 0 0 4 4h13L57 12z" fill="url(#dm-amber)"/>
    <rect x="29" y="28" width="18" height="4.4" rx="2.2" fill="url(#dm-amber)"/>
  </g>
</svg>
