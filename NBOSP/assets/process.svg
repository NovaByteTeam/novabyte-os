<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Process icon">
  <defs>
    <linearGradient id="proc-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="0.55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="proc-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fce7f3"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="proc-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="proc-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Connector branches & outer satellite nodes -->
  <g filter="url(#proc-ds)">
    <!-- Symmetrical radial connector bars anchored at (48, 48) -->
    <g fill="url(#proc-body)">
      <!-- Bottom-right (75, 71): atan2(23, 27) = 40.4deg -->
      <rect x="48" y="45.5" width="35.4" height="5" rx="2.5" transform="rotate(40.4 48 48)"/>
      <!-- Bottom-left (21, 71): atan2(23, -27) = 139.6deg -->
      <rect x="48" y="45.5" width="35.4" height="5" rx="2.5" transform="rotate(139.6 48 48)"/>
      <!-- Top-left (21, 25): atan2(-23, -27) = -139.6deg -->
      <rect x="48" y="45.5" width="35.4" height="5" rx="2.5" transform="rotate(-139.6 48 48)"/>
      <!-- Top-right (75, 25): atan2(-23, 27) = -40.4deg -->
      <rect x="48" y="45.5" width="35.4" height="5" rx="2.5" transform="rotate(-40.4 48 48)"/>
    </g>

    <!-- Outer 4 satellite process nodes -->
    <circle cx="21" cy="25" r="8.5" fill="url(#proc-top)"/>
    <circle cx="21" cy="25" r="5" fill="none" stroke="#be185d" stroke-width="1.3" opacity="0.38"/>

    <circle cx="75" cy="25" r="8.5" fill="url(#proc-top)"/>
    <circle cx="75" cy="25" r="5" fill="none" stroke="#be185d" stroke-width="1.3" opacity="0.38"/>

    <circle cx="21" cy="71" r="8.5" fill="url(#proc-top)"/>
    <circle cx="21" cy="71" r="5" fill="none" stroke="#be185d" stroke-width="1.3" opacity="0.38"/>

    <circle cx="75" cy="71" r="8.5" fill="url(#proc-top)"/>
    <circle cx="75" cy="71" r="5" fill="none" stroke="#be185d" stroke-width="1.3" opacity="0.38"/>
  </g>

  <!-- Central focal hub -->
  <g filter="url(#proc-ds)">
    <circle cx="48" cy="48" r="14" fill="url(#proc-body)"/>
    <circle cx="48" cy="48" r="10.2" fill="none" stroke="#831843" stroke-width="1.5" opacity="0.38"/>
    <circle cx="48" cy="48" r="6" fill="url(#proc-amber)"/>
  </g>
</svg>
