<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Archive icon">
  <defs>
    <linearGradient id="ac-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="ac-lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#99f6e4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="ac-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
    <linearGradient id="ac-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="ac-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#ac-ds)">
    <!-- lower box body overlapped 3px under lid -->
    <path d="M16 36 H80 V75.5 Q80 78.5 77 78.5 H19 Q16 78.5 16 75.5 Z" fill="url(#ac-body)"/>
    <!-- recessed lid shadow -->
    <rect x="16" y="38.5" width="64" height="4" fill="#115e59" opacity="0.35"/>
    <!-- 3D slanted top plane tucked cleanly behind front fascia -->
    <path d="M19.5 19 H76.5 Q78 19 79 20.4 L83.8 28 H12.2 L17 20.4 Q18 19 19.5 19 Z" fill="url(#ac-top)"/>
    <!-- front fascia of lid -->
    <rect x="12" y="26.5" width="72" height="12" rx="2.5" fill="url(#ac-lid)"/>
    <!-- crisp top fold highlight -->
    <rect x="13" y="26.5" width="70" height="1.5" rx="0.75" fill="#ccfbf1" opacity="0.8"/>
  </g>

  <!-- warm amber handle pull -->
  <g filter="url(#ac-ds)">
    <rect x="37" y="51" width="22" height="7" rx="3.5" fill="url(#ac-accent)"/>
  </g>
</svg>
