<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Alarm Clock icon">
  <defs>
    <linearGradient id="acl-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="acl-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f9ff"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="acl-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="acl-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="acl-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#acl-ds)">
    <!-- metallic top ringer hammer -->
    <rect x="46.2" y="16" width="3.6" height="10" rx="1.8" fill="url(#acl-metal)"/>
    <rect x="42.5" y="14.5" width="11" height="3.6" rx="1.8" fill="url(#acl-metal)"/>

    <!-- twin amber bells -->
    <path d="M18 33 A11 11 0 0 1 34 19 L39 25 L23 38 Z" fill="url(#acl-accent)"/>
    <path d="M78 33 A11 11 0 0 0 62 19 L57 25 L73 38 Z" fill="url(#acl-accent)"/>

    <!-- angled blue legs -->
    <path d="M33 72 L27 81 M63 72 L69 81" stroke="#2563eb" stroke-width="4.5" stroke-linecap="round"/>

    <!-- main clock casing -->
    <circle cx="48" cy="50" r="26" fill="url(#acl-body)"/>
    <!-- dial face -->
    <circle cx="48" cy="50" r="19.5" fill="url(#acl-top)"/>
    <!-- recessed inner bezel ring -->
    <circle cx="48" cy="50" r="19.5" fill="none" stroke="#1e3a8a" stroke-width="2" opacity="0.32"/>
    <!-- cardinal dial markers -->
    <path d="M48 33.5 V36 M48 64 V66.5 M31.5 50 H34 M62 50 H64.5" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round" opacity="0.38"/>
  </g>

  <!-- unified single-path clock hands -->
  <g filter="url(#acl-ds)">
    <path d="M48 37.5 A2 2 0 0 1 50 39.5 V48.2 L57.8 53.1 A2 2 0 1 1 55.7 56.5 L46.7 50.9 A2 2 0 0 1 46 49.3 V39.5 A2 2 0 0 1 48 37.5 Z" fill="url(#acl-accent)"/>
  </g>
</svg>
