<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Copy icon">
  <defs>
    <!-- 3-stop vertical rose-magenta gradient for primary front sheet -->
    <linearGradient id="cp-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbcfe8"/>
      <stop offset="0.55" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>

    <!-- Deeper 3-stop vertical rose-magenta gradient for rear stacked sheet -->
    <linearGradient id="cp-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="0.55" stop-color="#db2777"/>
      <stop offset="1" stop-color="#9d174d"/>
    </linearGradient>

    <!-- Warm amber gradient for foreground header accent bar -->
    <linearGradient id="cp-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Proportional NovaReg drop shadow -->
    <filter id="cp-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Rear stacked sheet (bottom-left) -->
  <g filter="url(#cp-ds)">
    <rect x="17" y="27" width="48" height="57" rx="7" fill="url(#cp-back)"/>
    <path d="M24 27.8h34" fill="none" stroke="#fce7f3" stroke-width="1.3" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Front overlapping sheet (top-right) -->
  <g filter="url(#cp-ds)">
    <rect x="31" y="13" width="48" height="57" rx="7" fill="url(#cp-body)"/>
    <!-- Crisp top-edge highlight -->
    <path d="M38 13.8h34" fill="none" stroke="#fce7f3" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>

    <!-- Recessed content lines (pill rects to avoid zero-height gradient issues) -->
    <rect x="39" y="40" width="32" height="4" rx="2" fill="#831843" opacity="0.38"/>
    <rect x="39" y="51" width="23" height="4" rx="2" fill="#831843" opacity="0.38"/>
  </g>

  <!-- Warm amber foreground header accent pill with secondary elevation -->
  <g filter="url(#cp-ds)">
    <rect x="39" y="25" width="32" height="5" rx="2.5" fill="url(#cp-amber)"/>
  </g>
</svg>
