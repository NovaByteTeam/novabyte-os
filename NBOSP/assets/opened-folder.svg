<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Opened Folder icon">
  <defs>
    <!-- 3-stop vertical violet/purple back folder gradient -->
    <linearGradient id="of-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>

    <!-- Lighter top tab highlight gradient -->
    <linearGradient id="of-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ede9fe" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </linearGradient>

    <!-- Front open flap gradient (richer violet tone for layered depth) -->
    <linearGradient id="of-flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddd6fe"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Warm amber foreground document sheet gradient -->
    <linearGradient id="of-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Proportional NovaReg drop shadow -->
    <filter id="of-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>

    <!-- Clipped silhouette for back folder plate -->
    <clipPath id="of-back-clip">
      <path d="M12 28 a7 7 0 0 1 7 -7 h20 l8 8 h30 a7 7 0 0 1 7 7 v36 a7 7 0 0 1 -7 7 H19 a7 7 0 0 1 -7 -7 Z"/>
    </clipPath>

    <!-- Clipped silhouette for front open flap -->
    <clipPath id="of-flap-clip">
      <path d="M16 44 a4 4 0 0 1 4 -3.5 H80 a4 4 0 0 1 3.8 5.2 L76 73 a8 8 0 0 1 -7.7 6 H19 a7 7 0 0 1 -6.8 -8.8 Z"/>
    </clipPath>
  </defs>

  <!-- Back folder plate with borderless depth -->
  <g filter="url(#of-ds)">
    <path d="M12 28 a7 7 0 0 1 7 -7 h20 l8 8 h30 a7 7 0 0 1 7 7 v36 a7 7 0 0 1 -7 7 H19 a7 7 0 0 1 -7 -7 Z" fill="url(#of-body)"/>

    <!-- Clipped inner top sheen and tab highlight pill -->
    <g clip-path="url(#of-back-clip)">
      <rect x="12" y="21" width="72" height="16" fill="url(#of-top)"/>
      <rect x="20" y="26.5" width="17" height="2.6" rx="1.3" fill="#4c1d95" opacity="0.38"/>
    </g>
  </g>

  <!-- Warm amber peeking document sheet tucked behind the front open flap -->
  <g filter="url(#of-ds)">
    <rect x="21" y="33" width="54" height="26" rx="4.5" fill="url(#of-accent)"/>
    <!-- Subtle recessed text lines on the peeking amber sheet -->
    <rect x="27" y="38" width="24" height="2.4" rx="1.2" fill="#92400e" opacity="0.38"/>
  </g>

  <!-- Angled front open folder flap overlapping the amber sheet seamlessly -->
  <g filter="url(#of-ds)">
    <path d="M16 44 a4 4 0 0 1 4 -3.5 H80 a4 4 0 0 1 3.8 5.2 L76 73 a8 8 0 0 1 -7.7 6 H19 a7 7 0 0 1 -6.8 -8.8 Z" fill="url(#of-flap)"/>

    <!-- Clipped top edge highlight and recessed crease line on the front flap -->
    <g clip-path="url(#of-flap-clip)">
      <rect x="12" y="40.5" width="73" height="5" fill="#ede9fe" opacity="0.5"/>
      <path d="M18 46.5 H79" fill="none" stroke="#4c1d95" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>
    </g>
  </g>
</svg>
