<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Repeat Button icon">
  <defs>
    
    <linearGradient id="rep-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="0.55" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>

    
    <linearGradient id="rep-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>

    
    <linearGradient id="rep-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    
    <filter id="rep-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  
  <g filter="url(#rep-ds)">
    
    <path d="M22 46V39a10 10 0 0 1 10-10h38" fill="none" stroke="url(#rep-body)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M61 20l10 9-10 9" fill="none" stroke="url(#rep-body)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>

    
    <path d="M32 28.5h34" fill="none" stroke="url(#rep-top)" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

    
    <g filter="url(#rep-ds)">
      <path d="M74 50v7a10 10 0 0 1-10 10H26" fill="none" stroke="url(#rep-accent)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M35 58l-10 9 10 9" fill="none" stroke="url(#rep-accent)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
