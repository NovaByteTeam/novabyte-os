<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Safe icon">
  <defs>
    <!-- Primary 3-stop vibrant red gradient -->
    <linearGradient id="sf-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset="0.55" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Lighter highlight gradient (matching the cylinder lid) -->
    <linearGradient id="sf-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fee2e2"/>
      <stop offset="1" stop-color="#fca5a5"/>
    </linearGradient>

    <!-- Warm amber accent gradient for the floating vault wheel & hinges -->
    <linearGradient id="sf-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Proportional drop shadow for 96x96 viewBox -->
    <filter id="sf-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Borderless safe vault with soft drop shadow -->
  <g filter="url(#sf-ds)">
    <!-- Main safe cabinet body (centred cleanly at y=15 to y=81) -->
    <rect x="14" y="15" width="68" height="66" rx="11" fill="url(#sf-body)"/>

    <!-- Subtle inner door seam (mirroring the cylinder rim detail) -->
    <rect x="19" y="20" width="58" height="56" rx="7.5" fill="none" stroke="#7f1d1d" stroke-width="2" opacity="0.38"/>

    <!-- Recessed circular dial backing plate -->
    <circle cx="48" cy="48" r="21" fill="#7f1d1d" opacity="0.28"/>

    <!-- Top-right status LED / keyhole accent -->
    <circle cx="69" cy="27" r="2.8" fill="url(#sf-top)"/>

    <!-- Left-side door hinges in warm amber -->
    <rect x="12" y="27" width="4.5" height="11" rx="2.25" fill="url(#sf-accent)"/>
    <rect x="12" y="58" width="4.5" height="11" rx="2.25" fill="url(#sf-accent)"/>

    <!-- Floating warm amber vault wheel with secondary drop shadow -->
    <g filter="url(#sf-ds)">
      <!-- Outer wheel rim -->
      <circle cx="48" cy="48" r="15.5" fill="none" stroke="url(#sf-accent)" stroke-width="4.5"/>
      <!-- 4 clean spokes connecting hub to wheel rim (non-zero bounding boxes) -->
      <path d="M48 33.5v29M33.5 48h29" fill="none" stroke="url(#sf-accent)" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M37.8 37.8l20.4 20.4M58.2 37.8L37.8 58.2" fill="none" stroke="url(#sf-accent)" stroke-width="3.2" stroke-linecap="round"/>
      <!-- Centre wheel hub -->
      <circle cx="48" cy="48" r="5.5" fill="url(#sf-accent)"/>
      <circle cx="48" cy="48" r="2.2" fill="#7f1d1d" opacity="0.5"/>
    </g>
  </g>
</svg>
