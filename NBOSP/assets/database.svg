<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Database icon">
  <defs>
    <!-- 3-stop vertical cyan-teal gradient for cylinder body -->
    <linearGradient id="db-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>

    <!-- Top lid highlight gradient -->
    <linearGradient id="db-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cffafe"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>

    <!-- Warm amber gradient for foreground status indicator accents -->
    <linearGradient id="db-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- ClipPath matching exact cylinder silhouette so groove strokes stay flush -->
    <clipPath id="db-clip">
      <path d="M18 25 a30 10.5 0 0 1 60 0 v44 a30 10.5 0 0 1 -60 0 z"/>
    </clipPath>

    <!-- Proportional NovaReg drop shadow -->
    <filter id="db-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Main database cylinder (outer filter, inner clipPath) -->
  <g filter="url(#db-ds)">
    <g clip-path="url(#db-clip)">
      <!-- Cylinder body -->
      <path d="M18 25 v44 a30 10.5 0 0 0 60 0 v-44 z" fill="url(#db-body)"/>

      <!-- Recessed tier divider grooves clipped flush with cylinder edges -->
      <path d="M18 40.5 a30 10.5 0 0 0 60 0" fill="none" stroke="#164e63" stroke-width="2.2" opacity="0.4"/>
      <path d="M18 55.5 a30 10.5 0 0 0 60 0" fill="none" stroke="#164e63" stroke-width="2.2" opacity="0.4"/>

      <!-- Top lid ellipse & inner recessed ring -->
      <ellipse cx="48" cy="25" rx="30" ry="10.5" fill="url(#db-top)"/>
      <ellipse cx="48" cy="25" rx="20.5" ry="6.6" fill="none" stroke="#0891b2" stroke-width="1.8" opacity="0.5"/>
    </g>
  </g>

  <!-- Warm amber foreground activity LEDs with secondary elevation -->
  <g filter="url(#db-ds)">
    <circle cx="26.5" cy="40" r="2.2" fill="url(#db-amber)"/>
    <circle cx="26.5" cy="55" r="2.2" fill="url(#db-amber)"/>
    <circle cx="26.5" cy="70" r="2.2" fill="url(#db-amber)"/>
  </g>
</svg>
