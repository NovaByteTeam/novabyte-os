<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Trash icon">
  <defs>
    <!-- Primary 3-stop vibrant green gradient -->
    <linearGradient id="tr-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="0.55" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>

    <!-- Lighter highlight gradient (matching the cylinder lid) -->
    <linearGradient id="tr-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>

    <!-- Warm amber accent gradient for the lid handle -->
    <linearGradient id="tr-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Proportional drop shadow for 96x96 viewBox -->
    <filter id="tr-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Borderless bin with soft drop shadow -->
  <g filter="url(#tr-ds)">
    <!-- Bin body (pulled up 2px so it sits cleanly inside the 96x96 safe area) -->
    <path d="M22 27h52l-4 52a6 6 0 0 1-6 5H32a6 6 0 0 1-6-5z" fill="url(#tr-body)"/>

    <!-- Subtle top rim shadow under the lid -->
    <path d="M22.5 32h51" fill="none" stroke="#14532d" stroke-width="2.5" opacity="0.35"/>

    <!-- Fixed & aligned vertical bin grooves (matching the cylinder rings) -->
    <g fill="none" stroke="#14532d" stroke-width="4" stroke-linecap="round" opacity="0.45">
      <path d="M34 41l2 31"/>
      <path d="M48 41v31"/>
      <path d="M62 41l-2 31"/>
    </g>

    <!-- Lid assembly with secondary drop shadow -->
    <g filter="url(#tr-ds)">
      <!-- Warm amber lid handle -->
      <path d="M37 20v-4.5a3.5 3.5 0 0 1 3.5-3.5h15a3.5 3.5 0 0 1 3.5 3.5V20" fill="none" stroke="url(#tr-accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Solid pill-shaped lid bar with lighter top highlight -->
      <rect x="16" y="18.5" width="64" height="6.5" rx="3.25" fill="url(#tr-top)"/>
    </g>
  </g>
</svg>
