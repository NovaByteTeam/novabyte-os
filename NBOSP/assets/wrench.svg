<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Wrench icon">
  <defs>
    <!-- Primary 3-stop vibrant purple gradient -->
    <linearGradient id="wr-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Warm amber accent gradient (matching the key in your reference) -->
    <linearGradient id="wr-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Drop shadow scaled down proportionally for a 96x96 viewBox -->
    <filter id="wr-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Borderless wrench body with soft drop shadow -->
  <g filter="url(#wr-ds)">
    <path d="M60 18a22 22 0 0 0-27 27L17 61a10 10 0 0 0 14 14l16-16a22 22 0 0 0 27-27L61 45 49 33z" fill="url(#wr-body)"/>
    
    <!-- Subtle translucent handle groove (matching the cylinder rings) -->
    <path d="M26 66 L40 52" stroke="#4c1d95" stroke-width="2.6" stroke-linecap="round" opacity="0.35"/>
    
    <!-- Warm amber rivet accent -->
    <circle cx="25" cy="68" r="4.2" fill="url(#wr-accent)"/>
    <circle cx="25" cy="68" r="1.8" fill="#4c1d95" opacity="0.45"/>
  </g>
</svg>
