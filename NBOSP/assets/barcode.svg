<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Barcode icon">
  <defs>
    <!-- 3-stop vertical violet-purple gradient matching incoming hue -->
    <linearGradient id="bc-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddd6fe"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Warm amber gradient for foreground scanner laser beam -->
    <linearGradient id="bc-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Proportional NovaReg drop shadow -->
    <filter id="bc-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Main Barcode Tag / Card Body -->
  <g filter="url(#bc-ds)">
    <!-- Borderless 3-stop violet rounded card -->
    <rect x="15" y="19" width="66" height="58" rx="9" fill="url(#bc-body)"/>
    <!-- Crisp top-edge specular highlight -->
    <path d="M24 19.8 H72" fill="none" stroke="#ede9fe" stroke-width="1.4" stroke-linecap="round" opacity="0.68"/>

    <!-- Recessed vertical barcode bars (pill rects to avoid zero-width gradient issues) -->
    <rect x="23" y="28" width="3.5" height="32" rx="1.75" fill="#3b0764" opacity="0.38"/>
    <rect x="29.5" y="28" width="5" height="32" rx="2" fill="#3b0764" opacity="0.38"/>
    <rect x="38" y="28" width="3" height="32" rx="1.5" fill="#3b0764" opacity="0.38"/>
    <rect x="44" y="28" width="6" height="32" rx="2" fill="#3b0764" opacity="0.38"/>
    <rect x="53.5" y="28" width="3.5" height="32" rx="1.75" fill="#3b0764" opacity="0.38"/>
    <rect x="60.5" y="28" width="5" height="32" rx="2" fill="#3b0764" opacity="0.38"/>
    <rect x="69" y="28" width="4" height="32" rx="1.8" fill="#3b0764" opacity="0.38"/>

    <!-- Recessed serial code bar at bottom -->
    <rect x="23" y="65" width="34" height="4" rx="2" fill="#3b0764" opacity="0.32"/>
    <rect x="61" y="65" width="12" height="4" rx="2" fill="#3b0764" opacity="0.32"/>
  </g>

  <!-- Warm amber foreground scanner laser beam with secondary elevation -->
  <g filter="url(#bc-ds)">
    <rect x="11" y="42" width="74" height="4.5" rx="2.25" fill="url(#bc-amber)"/>
  </g>
</svg>
