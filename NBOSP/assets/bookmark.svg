<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Bookmark icon">
  <defs>
    <!-- 3-stop vertical warm amber-gold gradient matching incoming hue -->
    <linearGradient id="bm-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>

    <!-- Lighter warm-cream top ribbon highlight gradient -->
    <linearGradient id="bm-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Sky-blue foreground accent gradient (used when base icon is gold/amber) -->
    <linearGradient id="bm-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>

    <!-- ClipPath matching bookmark ribbon silhouette so top band aligns flush -->
    <clipPath id="bm-clip">
      <path d="M27 14 H69 A6 6 0 0 1 75 20 V79.5 A2.5 2.5 0 0 1 71.2 81.6 L48 66.8 L24.8 81.6 A2.5 2.5 0 0 1 21 79.5 V20 A6 6 0 0 1 27 14 Z"/>
    </clipPath>

    <!-- Proportional NovaReg drop shadow -->
    <filter id="bm-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Main Bookmark Ribbon (outer filter, inner clipPath) -->
  <g filter="url(#bm-ds)">
    <g clip-path="url(#bm-clip)">
      <!-- Main 3-stop warm amber ribbon body -->
      <path d="M27 14 H69 A6 6 0 0 1 75 20 V79.5 A2.5 2.5 0 0 1 71.2 81.6 L48 66.8 L24.8 81.6 A2.5 2.5 0 0 1 21 79.5 V20 A6 6 0 0 1 27 14 Z" fill="url(#bm-body)"/>

      <!-- Subtle lighter top header fold & recessed groove -->
      <rect x="21" y="14" width="54" height="12" fill="url(#bm-top)" opacity="0.55"/>
      <rect x="21" y="25" width="54" height="1.8" fill="#78350f" opacity="0.26"/>
    </g>

    <!-- Crisp top-edge specular highlight -->
    <path d="M27 14.8 H69" fill="none" stroke="#fffbeb" stroke-width="1.4" stroke-linecap="round" opacity="0.72"/>
  </g>

  <!-- Sky-blue foreground star & accent bar with secondary elevation -->
  <g filter="url(#bm-ds)">
    <!-- Centered 5-point rounded star badge -->
    <path d="M48 34.5 L51.4 41.4 L59 42.5 L53.5 47.8 L54.8 55.4 L48 51.8 L41.2 55.4 L42.5 47.8 L37 42.5 L44.6 41.4 Z" fill="url(#bm-sky)"/>
  </g>
</svg>
