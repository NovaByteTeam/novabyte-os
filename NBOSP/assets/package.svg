<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Package icon">
  <defs>
    <!-- 3-stop vertical teal base gradient -->
    <linearGradient id="pk-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Lighter top lid highlight gradient -->
    <linearGradient id="pk-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>

    <!-- Right-side shading facet for isometric 3D depth -->
    <linearGradient id="pk-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#115e59" stop-opacity="0.38"/>
    </linearGradient>

    <!-- Warm amber foreground packing tape gradient -->
    <linearGradient id="pk-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Proportional NovaReg drop shadow -->
    <filter id="pk-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>

    <!-- Clipped silhouette matching the isometric box -->
    <clipPath id="pk-clip">
      <path d="M48 13 L80 31 V66 L48 84 L16 66 V31 Z"/>
    </clipPath>
  </defs>

  <!-- Isometric teal box with borderless depth -->
  <g filter="url(#pk-ds)">
    <path d="M48 13 L80 31 V66 L48 84 L16 66 V31 Z" fill="url(#pk-body)"/>

    <!-- Clipped 3D top lid, right shadow facet, and recessed fold creases -->
    <g clip-path="url(#pk-clip)">
      <polygon points="48,13 80,31 48,49 16,31" fill="url(#pk-top)"/>
      <polygon points="48,49 80,31 80,66 48,84" fill="url(#pk-right)"/>
      <path d="M16 31 L48 49 L80 31 M48 49 V84" fill="none" stroke="#115e59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.38"/>
    </g>
  </g>

  <!-- Warm amber foreground packing tape strap with secondary drop shadow -->
  <g filter="url(#pk-ds)">
    <g clip-path="url(#pk-clip)">
      <!-- Constant-width isometric tape ribbon: top band + front-right vertical flap -->
      <path d="M27.5 24.5 L36.5 19.4 L68.5 37.5 V50.5 L59.5 55.6 V42.6 Z" fill="url(#pk-accent)"/>
      <!-- Recessed fold crease along the front-right top edge -->
      <path d="M59.5 42.6 L68.5 37.5" fill="none" stroke="#92400e" stroke-width="1.6" stroke-linecap="round" opacity="0.38"/>
    </g>
  </g>
</svg>
