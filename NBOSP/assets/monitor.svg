<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Monitor icon">
  <defs>
    <linearGradient id="mn-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="mn-stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="mn-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <linearGradient id="mn-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="mn-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
    <clipPath id="mn-bezel-clip">
      <rect x="11" y="14" width="74" height="51" rx="8"/>
    </clipPath>
    <clipPath id="mn-screen-clip">
      <rect x="18" y="21" width="60" height="35" rx="4"/>
    </clipPath>
  </defs>

  <!-- Stand neck tucked 3px behind bezel and 2px into base -->
  <g filter="url(#mn-ds)">
    <rect x="43" y="62" width="10" height="17" rx="2" fill="url(#mn-stand)"/>
  </g>

  <!-- Main monitor chassis & display -->
  <g filter="url(#mn-ds)">
    <g clip-path="url(#mn-bezel-clip)">
      <rect x="11" y="14" width="74" height="51" rx="8" fill="url(#mn-body)"/>
      <!-- Subtle top edge specular highlight -->
      <line x1="15" y1="15.2" x2="81" y2="15.2" stroke="#cffafe" stroke-width="1.8" opacity="0.7"/>
      <!-- Recessed chin detail bar -->
      <rect x="41" y="59.5" width="14" height="2.4" rx="1.2" fill="#164e63" opacity="0.4"/>
    </g>

    <!-- Recessed light-cyan screen -->
    <g clip-path="url(#mn-screen-clip)">
      <rect x="18" y="21" width="60" height="35" rx="4" fill="url(#mn-screen)"/>
      <!-- Subtle top inner screen shadow rim -->
      <rect x="18" y="21" width="60" height="35" rx="4" fill="none" stroke="#0e7490" stroke-width="1.6" opacity="0.35"/>
      <!-- Clean minimal UI lines on screen -->
      <rect x="24" y="28" width="22" height="3.2" rx="1.6" fill="#0891b2" opacity="0.35"/>
      <rect x="24" y="34.5" width="15" height="3.2" rx="1.6" fill="#0891b2" opacity="0.25"/>
    </g>
  </g>

  <!-- Foreground warm amber accents: stand base & screen status pill -->
  <g filter="url(#mn-ds)">
    <rect x="30" y="77" width="36" height="5.5" rx="2.75" fill="url(#mn-amber)"/>
    <rect x="56" y="27.5" width="16" height="10.5" rx="3" fill="url(#mn-amber)"/>
  </g>
</svg>
