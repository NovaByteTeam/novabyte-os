<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="NovaByte — Privacy-First OS">
  <defs>
    <linearGradient id="nb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="nb-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="nb-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="nb-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nb-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <clipPath id="nb-clip">
      <circle cx="240" cy="315" r="90"/>
    </clipPath>
    <filter id="nb-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- dark slate backdrop -->
  <rect width="1200" height="630" fill="url(#nb-bg)"/>

  <!-- subtle ambient radial glow behind emblem -->
  <circle cx="240" cy="315" r="165" fill="#38bdf8" opacity="0.06"/>

  <!-- top & bottom accent bars -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#nb-bar)"/>
  <rect x="0" y="622" width="1200" height="8" fill="url(#nb-bar)"/>

  <!-- borderless 3D sky-blue emblem medallion -->
  <g filter="url(#nb-ds)">
    <g clip-path="url(#nb-clip)">
      <circle cx="240" cy="315" r="90" fill="url(#nb-body)"/>
      <!-- slim upper rim specular highlight -->
      <path d="M150 315 A90 90 0 0 1 330 315 A90 84 0 0 0 150 315 Z" fill="url(#nb-top)"/>
      <!-- recessed inner bezel ring -->
      <circle cx="240" cy="315" r="72" fill="none" stroke="#1e3a8a" stroke-width="5" opacity="0.34"/>
    </g>
  </g>

  <!-- unified single-path warm amber N monogram -->
  <g filter="url(#nb-ds)">
    <path d="M206 351 V279 Q206 276 209 276 H220 Q222.5 276 224 278.2 L258 326.5 V279 Q258 276 261 276 H271 Q274 276 274 279 V351 Q274 354 271 354 H260 Q257.5 354 256 351.8 L222 303.5 V351 Q222 354 219 354 H209 Q206 354 206 351 Z" fill="url(#nb-accent)"/>
  </g>

  <!-- brand typography -->
  <text x="385" y="298" font-size="78" font-weight="700" letter-spacing="-1" fill="#f8fafc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">NovaByte</text>
  <text x="385" y="368" font-size="42" font-weight="500" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Privacy-First OS</text>
</svg>
