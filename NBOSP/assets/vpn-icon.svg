<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="VPN icon">
  <defs>
    <!-- Primary 3-stop cyan gradient -->
    <linearGradient id="vpn-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>

    <!-- Lighter highlight gradient -->
    <linearGradient id="vpn-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cffafe"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>

    <!-- Warm amber accent gradient -->
    <linearGradient id="vpn-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Proportional drop shadow for 96x96 viewBox -->
    <filter id="vpn-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Borderless shield with soft drop shadow -->
  <g filter="url(#vpn-ds)">
    <!-- Shield base -->
    <path d="M48 11 79 23v23c0 19-12 31-31 40-19-9-31-21-31-40V23z" fill="url(#vpn-body)"/>

    <!-- Subtle inner shield bevel (mirroring the cylinder rim detail) -->
    <path d="M48 16.5 73.5 26.5v19.5c0 16-9.8 26.2-25.5 34-15.7-7.8-25.5-18-25.5-34V26.5z" fill="none" stroke="#164e63" stroke-width="2" opacity="0.35"/>

    <!-- Top-right glossy edge highlight -->
    <path d="M48 18 72 27v14" fill="none" stroke="url(#vpn-top)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

    <!-- Fixed central emblem: clean warm amber node + balanced signal/tunnel arc -->
    <g filter="url(#vpn-ds)">
      <path d="M35 45a13 13 0 0 1 26 0" fill="none" stroke="url(#vpn-top)" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="48" cy="46" r="7.5" fill="url(#vpn-accent)"/>
      <path d="M48 53.5v11.5" fill="none" stroke="url(#vpn-accent)" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
