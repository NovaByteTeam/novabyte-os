<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="People icon">
  <defs>
    <linearGradient id="ppl-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="ppl-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cffafe"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="ppl-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="ppl-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Flanking background people in cyan -->
  <g filter="url(#ppl-ds)">
    <!-- Left flanking person -->
    <circle cx="24" cy="40" r="8.5" fill="url(#ppl-top)"/>
    <circle cx="24" cy="40" r="5.5" fill="none" stroke="#0e7490" stroke-width="1.2" opacity="0.35"/>
    <path d="M11 70 Q11 73 14 73 H34 Q37 73 37 70 C36.5 60 31.5 54 24 54 C16.5 54 11.5 60 11 70 Z" fill="url(#ppl-body)"/>
    <path d="M15.5 69.5 H32.5 C31.8 62.5 28.5 58 24 58 C19.5 58 16.2 62.5 15.5 69.5 Z" fill="none" stroke="#164e63" stroke-width="1.3" opacity="0.38"/>

    <!-- Right flanking person -->
    <circle cx="72" cy="40" r="8.5" fill="url(#ppl-top)"/>
    <circle cx="72" cy="40" r="5.5" fill="none" stroke="#0e7490" stroke-width="1.2" opacity="0.35"/>
    <path d="M59 70 Q59 73 62 73 H82 Q85 73 85 70 C84.5 60 79.5 54 72 54 C64.5 54 59.5 60 59 70 Z" fill="url(#ppl-body)"/>
    <path d="M63.5 69.5 H80.5 C79.8 62.5 76.5 58 72 58 C67.5 58 64.2 62.5 63.5 69.5 Z" fill="none" stroke="#164e63" stroke-width="1.3" opacity="0.38"/>
  </g>

  <!-- Foreground focal center person in warm amber -->
  <g filter="url(#ppl-ds)">
    <circle cx="48" cy="31" r="12" fill="url(#ppl-amber)"/>
    <circle cx="48" cy="31" r="8.5" fill="none" stroke="#92400e" stroke-width="1.3" opacity="0.35"/>
    <path d="M26 73 Q26 77 30 77 H66 Q70 77 70 73 C69 59 60.5 50 48 50 C35.5 50 27 59 26 73 Z" fill="url(#ppl-amber)"/>
    <path d="M31 72.5 H65 C64 61.5 57.5 54.5 48 54.5 C38.5 54.5 32 61.5 31 72.5 Z" fill="none" stroke="#92400e" stroke-width="1.4" opacity="0.38"/>
  </g>
</svg>
