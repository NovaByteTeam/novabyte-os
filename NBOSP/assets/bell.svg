<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Bell icon">
  <defs>
    <!-- 3-stop vertical teal-aqua gradient matching incoming hue -->
    <linearGradient id="bl-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#99f6e4"/>
      <stop offset="0.55" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Lighter aqua-mint gradient for top crown loop & lower bell rim highlight -->
    <linearGradient id="bl-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>

    <!-- Warm amber gradient for foreground clapper & notification accent -->
    <linearGradient id="bl-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Proportional NovaReg drop shadow -->
    <filter id="bl-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Warm amber foreground clapper (behind bell lip with secondary elevation) -->
  <g filter="url(#bl-ds)">
    <path d="M39.5 68.5 A8.5 8.5 0 0 0 56.5 68.5 Z" fill="url(#bl-amber)"/>
  </g>

  <!-- Main Bell Dome & Top Crown Loop -->
  <g filter="url(#bl-ds)">
    <!-- Top hanger crown ring (overlaps 2px into bell dome apex to prevent seam) -->
    <circle cx="48" cy="17.5" r="5" fill="none" stroke="url(#bl-top)" stroke-width="3.6"/>

    <!-- Smooth borderless bell body -->
    <path d="M48 19 C38.5 19 32 25.5 32 34.5 V42 C32 51.5 27.5 58.2 21.8 62.6 C19.4 64.5 20.7 69 24.1 69 H71.9 C75.3 69 76.6 64.5 74.2 62.6 C68.5 58.2 64 51.5 64 42 V34.5 C64 25.5 57.5 19 48 19 Z" fill="url(#bl-body)"/>

    <!-- Recessed lower rim collar groove -->
    <path d="M23.5 63.2 H72.5" fill="none" stroke="#115e59" stroke-width="1.8" stroke-linecap="round" opacity="0.34"/>

    <!-- Soft curved dome specular highlight -->
    <path d="M37 35 C37 28.5 40.5 24.5 45.5 23.5" fill="none" stroke="#f0fdfa" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Warm amber notification badge dot on upper-right shoulder with secondary elevation -->
  <g filter="url(#bl-ds)">
    <circle cx="66.5" cy="24.5" r="6.5" fill="url(#bl-amber)"/>
  </g>
</svg>
