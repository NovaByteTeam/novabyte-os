<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="RSS icon">
  <defs>
    
    <linearGradient id="rss-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>

    
    <linearGradient id="rss-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cffafe"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>

    
    <linearGradient id="rss-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    
    <filter id="rss-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  
  <g filter="url(#rss-ds)">
    
    <path d="M22 24a50 50 0 0 1 50 50" fill="none" stroke="url(#rss-body)" stroke-width="9.5" stroke-linecap="round"/>

    
    <path d="M22 46a28 28 0 0 1 28 28" fill="none" stroke="url(#rss-body)" stroke-width="9.5" stroke-linecap="round"/>

    
    <path d="M23 23.5a50.5 50.5 0 0 1 49.5 49.5" fill="none" stroke="url(#rss-top)" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

    
    <g filter="url(#rss-ds)">
      <circle cx="25.5" cy="70.5" r="8" fill="url(#rss-accent)"/>
    </g>
  </g>
</svg>
