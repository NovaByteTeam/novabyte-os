<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Command Line icon">
  <defs>
    <!-- 3-stop vertical warm amber-gold gradient matching incoming hue -->
    <linearGradient id="cl-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>

    <!-- Lighter warm-cream top header highlight gradient -->
    <linearGradient id="cl-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Sky-blue foreground accent gradient (used when base icon is gold/amber) -->
    <linearGradient id="cl-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>

    <!-- ClipPath matching terminal window so top titlebar header aligns flush -->
    <clipPath id="cl-clip">
      <rect x="11" y="15" width="74" height="58" rx="9"/>
    </clipPath>

    <!-- Proportional NovaReg drop shadow -->
    <filter id="cl-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Base stand pill & stem -->
  <g filter="url(#cl-ds)">
    <rect x="42" y="71" width="12" height="9" rx="2" fill="url(#cl-body)"/>
    <rect x="25" y="78" width="46" height="5.5" rx="2.75" fill="url(#cl-sky)"/>
  </g>

  <!-- Main Terminal Display Window (outer filter, inner clipPath) -->
  <g filter="url(#cl-ds)">
    <g clip-path="url(#cl-clip)">
      <!-- Main amber terminal screen -->
      <rect x="11" y="15" width="74" height="58" rx="9" fill="url(#cl-body)"/>

      <!-- Subtle lighter top titlebar strip -->
      <rect x="11" y="15" width="74" height="12" fill="url(#cl-top)" opacity="0.55"/>

      <!-- Recessed window control dots -->
      <circle cx="19.5" cy="21" r="2" fill="#78350f" opacity="0.38"/>
      <circle cx="26" cy="21" r="2" fill="#78350f" opacity="0.38"/>
      <circle cx="32.5" cy="21" r="2" fill="#78350f" opacity="0.38"/>
    </g>
    <!-- Crisp top-edge highlight -->
    <path d="M20 15.8h56" fill="none" stroke="#fffbeb" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Sky-blue foreground command prompt chevron (`>`) & cursor pill (`_`) with secondary elevation -->
  <g filter="url(#cl-ds)">
    <!-- Unified single-path rounded chevron (`>`) -->
    <path d="M23.8 36.2 A2.4 2.4 0 0 1 27.1 35.8 L39.2 45.1 A2.4 2.4 0 0 1 39.2 48.9 L27.1 58.2 A2.4 2.4 0 1 1 24.2 54.4 L33.8 47 L24.2 39.6 A2.4 2.4 0 0 1 23.8 36.2 Z" fill="url(#cl-sky)"/>
    <!-- Rounded cursor underscore pill -->
    <rect x="45" y="54.2" width="24" height="4.8" rx="2.4" fill="url(#cl-sky)"/>
  </g>
</svg>
