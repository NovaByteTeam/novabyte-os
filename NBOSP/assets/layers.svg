<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Layers icon">
  <defs>
    <linearGradient id="ly-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="ly-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="ly-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="ly-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
    <clipPath id="ly-top-clip">
      <polygon points="48,16 80,32.5 48,49 16,32.5"/>
    </clipPath>
  </defs>

  <!-- bottom sky-blue layer -->
  <g filter="url(#ly-ds)">
    <polygon points="48,42 80,58.5 48,75 16,58.5" fill="url(#ly-body)" stroke="url(#ly-body)" stroke-width="2.2" stroke-linejoin="round"/>
    <polyline points="16.5,58.8 48,75 79.5,58.8" fill="none" stroke="#1e3a8a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.38"/>
  </g>

  <!-- middle warm amber focal layer -->
  <g filter="url(#ly-ds)">
    <polygon points="48,29 80,45.5 48,62 16,45.5" fill="url(#ly-amber)" stroke="url(#ly-amber)" stroke-width="2.2" stroke-linejoin="round"/>
    <polyline points="16.5,45.8 48,62 79.5,45.8" fill="none" stroke="#92400e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
  </g>

  <!-- top sky-blue layer -->
  <g filter="url(#ly-ds)">
    <polygon points="48,16 80,32.5 48,49 16,32.5" fill="url(#ly-top)" stroke="url(#ly-top)" stroke-width="2.2" stroke-linejoin="round"/>
    <g clip-path="url(#ly-top-clip)">
      <polyline points="23,32.5 48,19.6 73,32.5" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
    </g>
    <polyline points="16.5,32.8 48,49 79.5,32.8" fill="none" stroke="#1e3a8a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
  </g>
</svg>
