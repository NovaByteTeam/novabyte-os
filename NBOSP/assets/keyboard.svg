<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Keyboard icon">
  <defs>
    <linearGradient id="kb-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset="0.55" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="kb-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fee2e2"/>
      <stop offset="1" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="kb-key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1f2"/>
      <stop offset="1" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="kb-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="kb-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
    <clipPath id="kb-clip">
      <rect x="12" y="24" width="72" height="48" rx="10"/>
    </clipPath>
  </defs>

  <!-- keyboard chassis -->
  <g filter="url(#kb-ds)">
    <g clip-path="url(#kb-clip)">
      <rect x="12" y="24" width="72" height="48" rx="10" fill="url(#kb-body)"/>
      <!-- top highlight bevel -->
      <rect x="12" y="24" width="72" height="8" fill="url(#kb-top)" opacity="0.55"/>
      <!-- recessed inner rim -->
      <rect x="13.5" y="25.5" width="69" height="45" rx="8.5" fill="none" stroke="#7f1d1d" stroke-width="1.5" opacity="0.35"/>
    </g>
  </g>

  <!-- key rows & warm amber spacebar -->
  <g filter="url(#kb-ds)">
    <!-- row 1 -->
    <rect x="20" y="33.5" width="8" height="7" rx="2.2" fill="url(#kb-key)"/>
    <rect x="32" y="33.5" width="8" height="7" rx="2.2" fill="url(#kb-key)"/>
    <rect x="44" y="33.5" width="8" height="7" rx="2.2" fill="url(#kb-key)"/>
    <rect x="56" y="33.5" width="8" height="7" rx="2.2" fill="url(#kb-key)"/>
    <rect x="68" y="33.5" width="8" height="7" rx="2.2" fill="url(#kb-key)"/>
    <!-- row 2 -->
    <rect x="20" y="45.5" width="8" height="7" rx="2.2" fill="url(#kb-key)"/>
    <rect x="32" y="45.5" width="8" height="7" rx="2.2" fill="url(#kb-key)"/>
    <rect x="44" y="45.5" width="8" height="7" rx="2.2" fill="url(#kb-key)"/>
    <rect x="56" y="45.5" width="8" height="7" rx="2.2" fill="url(#kb-key)"/>
    <rect x="68" y="45.5" width="8" height="7" rx="2.2" fill="url(#kb-key)"/>
    <!-- warm amber focal spacebar -->
    <rect x="24" y="58" width="48" height="6.5" rx="3.25" fill="url(#kb-amber)"/>
  </g>
</svg>
