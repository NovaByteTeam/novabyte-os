<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7e22ce"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e8ff"/>
      <stop offset="1" stop-color="#d8b4fe"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="48" cy="86" rx="29" ry="5" fill="#000" opacity=".2"/>

  <!-- Main Isometric Cube (Exact 2:1 / 30x15 Ratio) -->
  <path d="M18 31v35l30 15V46z" fill="url(#front)"/>
  <path d="M48 46v35l30-15V31z" fill="url(#side)"/>
  <path d="M48 16 78 31 48 46 18 31z" fill="url(#top)"/>

  <!-- Inner Top Panel & Isometric Glare -->
  <path d="M48 20.5 69 31 48 41.5 27 31z" fill="#faf5ff"/>
  <ellipse cx="41" cy="28" rx="9" ry="3.5" transform="rotate(-26.565 41 28)" fill="#fff" opacity=".55"/>

  <!-- Left Face: Isometric Photo Card -->
  <g transform="translate(33 56) skewY(26.565)">
    <rect x="-9.5" y="-10" width="19" height="20" rx="2" fill="#fff"/>
    <path d="M-7.5 6.5 L-2.5 -1 L1.5 3.5 L4.5 0 L7.5 6.5 Z" fill="#a855f7"/>
    <circle cx="4" cy="-4.5" r="2" fill="#fbbf24"/>
  </g>

  <!-- Right Face: Isometric Video Player Card -->
  <g transform="translate(63 56) skewY(-26.565)">
    <rect x="-9.5" y="-10" width="19" height="20" rx="2" fill="#4c1d95" stroke="#c084fc" stroke-width="1.2"/>
    <path d="M-3 -4.5 L5 0 L-3 4.5 Z" fill="#f3e8ff"/>
  </g>
</svg>
