    <linearGradient id="te-frame" x2="0" y2="1"><stop stop-color="#475569"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="te-bar" x2="0" y2="1"><stop stop-color="#64748b"/><stop offset="1" stop-color="#334155"/></linearGradient>
  </defs>
  <ellipse cx="48" cy="82" rx="32" ry="6" fill="#0f172a" opacity=".22"/>
  
  <!-- Window shadow & main frame (centred on x=48 with +2px X, +3px Y offset) -->
