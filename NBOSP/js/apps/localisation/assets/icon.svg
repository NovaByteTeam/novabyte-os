<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="globe" cx="38%" cy="32%" r="68%">
      <stop offset="0" stop-color="#a7f3d0"/>
      <stop offset=".5" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </radialGradient>
    <clipPath id="sphere-clip">
      <circle cx="48" cy="45" r="31"/>
    </clipPath>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="48" cy="84" rx="26" ry="4.5" fill="#000" opacity=".2"/>

  <!-- Main Emerald Sphere -->
  <circle cx="48" cy="45" r="31" fill="url(#globe)"/>

  <!-- Clipped Latitude & Longitude Grid Lines -->
  <g clip-path="url(#sphere-clip)" fill="none" stroke="#d1fae5" stroke-width="2.5" opacity=".9">
    <!-- Prime Meridian & Smooth Elliptical Longitude -->
    <path d="M48 14v62"/>
    <ellipse cx="48" cy="45" rx="16" ry="31"/>
    <!-- Full-Width Latitude Lines -->
    <path d="M16 45h64M20 29h56M20 61h56"/>
  </g>

  <!-- Subtle Right-Side Crescent Shadow -->
  <path d="M56 15a31 31 0 0 1 0 60 26 31 0 0 0 0-60z" fill="#064e3b" opacity=".28"/>

  <!-- Top-Left Specular Glare -->
  <ellipse cx="37" cy="24" rx="10" ry="4.5" fill="#fff" opacity=".38" transform="rotate(-28 37 24)"/>
</svg>
