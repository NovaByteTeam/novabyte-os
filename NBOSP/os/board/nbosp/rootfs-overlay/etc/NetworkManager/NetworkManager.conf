[main]
plugins=keyfile

[keyfile]
# NM manages all interfaces; udhcpc/ifupdown must not touch them
unmanaged-devices=none

[logging]
level=INFO
domains=ALL

[device]
# SECURITY (2026-11-15 audit, finding LOW-9): probe-frame MAC randomization
# was explicitly disabled — every Wi-Fi scan broadcast the device's real
# (and, with the udev interface-name pinning, stable) MAC, a location-
# privacy regression NM fixed by default years ago. Removing the override
# restores NM's default randomized probe MACs.
wifi.scan-rand-mac-address=yes
