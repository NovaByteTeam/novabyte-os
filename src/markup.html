<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaByte Store</title>
<meta name="description" content="Download apps for NovaByte OS. Browse, preview, and install .novaapp packages.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com" referrerpolicy="no-referrer">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin referrerpolicy="no-referrer">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" referrerpolicy="no-referrer">
<link rel="stylesheet" href="styling.css">
</head>
<body>

<header class="site-header">
  <div class="shell header-inner">
    <div class="wordmark">
      <svg class="wordmark-hex" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="var(--glow-primary)"/>
            <stop offset="100%" stop-color="var(--aurora-violet)"/>
          </linearGradient>
        </defs>
        <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="none" stroke="url(#hg)" stroke-width="2"/>
        <text x="20" y="25" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="700" fill="url(#hg)">NB</text>
      </svg>
      <span class="wordmark-text">NovaByte <span class="wordmark-store">Store</span></span>
    </div>
    <div class="header-controls">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input class="search-input" type="search" placeholder="Search apps…" aria-label="Search apps" id="search-input">
      </div>
    </div>
  </div>
</header>

<main>
  <div class="shell">

    <section class="hero">
      <p class="hero-eyebrow">NovaByte OS</p>
      <h1 class="hero-headline">Apps for your OS.</h1>
      <p class="hero-sub">Browse and install <code>.novaapp</code> packages. Drop them straight into App Manager — no setup required.</p>
    </section>

    <nav class="category-bar" aria-label="Filter by category">
      <button class="cat-btn is-active" data-cat="all">All</button>
      <button class="cat-btn" data-cat="productivity">Productivity</button>
      <button class="cat-btn" data-cat="utilities">Utilities</button>
      <button class="cat-btn" data-cat="creative">Creative</button>
      <button class="cat-btn" data-cat="system">System</button>
      <button class="cat-btn" data-cat="games">Games</button>
    </nav>

    <div class="apps-grid" id="apps-grid" aria-live="polite" aria-label="App listings">
      <div class="grid-loading" id="grid-loading" aria-label="Loading apps">
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
      </div>
    </div>

    <p class="grid-empty hidden" id="grid-empty">No apps match your search.</p>

  </div>
</main>

<footer class="site-footer">
  <div class="shell footer-inner">
    <span class="footer-copy">NovaByte Store</span>
    <span class="footer-note">Install by dropping a <code>.novaapp</code> into App Manager</span>
    <a class="footer-link" href="apps.json" target="_blank" rel="noopener">apps.json</a>
  </div>
</footer>

<!-- App detail modal -->
<div class="modal-backdrop hidden" id="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-name">
  <div class="modal-panel">
    <button class="modal-close" id="modal-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <div class="modal-icon-wrap">
      <div class="modal-icon" id="modal-icon" aria-hidden="true"></div>
    </div>
    <div class="modal-meta">
      <h2 class="modal-name" id="modal-name"></h2>
      <p class="modal-author" id="modal-author"></p>
    </div>
    <div class="modal-badges" id="modal-badges"></div>
    <p class="modal-desc" id="modal-desc"></p>
    <div class="modal-detail-row">
      <span class="detail-label">App ID</span>
      <code class="detail-value" id="modal-id"></code>
    </div>
    <div class="modal-detail-row">
      <span class="detail-label">Version</span>
      <span class="detail-value" id="modal-version"></span>
    </div>
    <div class="modal-detail-row">
      <span class="detail-label">Size</span>
      <span class="detail-value" id="modal-size"></span>
    </div>
    <a class="modal-download-btn" id="modal-download" href="#" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Download .novaapp
    </a>
  </div>
</div>

<script type="module" src="logic.js"></script>
</body>
</html>
